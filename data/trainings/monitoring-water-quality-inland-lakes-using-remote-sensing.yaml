summary: This ARSET training focuses on using remote sensing observations for assessing water quality
  parameters in inland lakes.
description: This advanced-level training led by NASA's Applied Remote Sensing Training Program (ARSET)
  focuses on using remote sensing observations from Landsat 8 and 9, Sentinel-2, and Sentinel-3A and -3B
  for assessing water quality parameters including chlorophyll-a concentration, turbidity, and total suspended
  solids (TSS) in inland lakes. This training also highlights the importance of in situ measurements of
  these parameters, coincident with satellite observations, in developing methodologies for operational
  water quality monitoring. Participants perform hands-on exercises in Google Earth Engine (GEE) to access
  satellite data and develop methodologies to assess water quality parameters. In addition, we provide
  an overview of Cyanobacteria Assessment Network (CyAN), an early warning system to assess algal blooms
  in freshwater lakes.
