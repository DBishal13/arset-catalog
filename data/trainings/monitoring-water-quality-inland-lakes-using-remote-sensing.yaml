sessions:
- part: 1
  title: Overview of Remote Sensing Observations to Assess Water Quality
  agenda:
  - Describe state-of-the art, high spatial and spectral resolution observations and their access using
    GEE
  - Describe open source, in situ measurements of water quality parameters
  - Provide information about upcoming NASA missions useful for water quality monitoring
  - Introduction to GEE
  - Access Landsat 8 and Sentinel-2 surface reflectance data using GEE
  - Access Sentinel-3 top of the atmosphere reflectance data using GEE
  - Explore and download in situ measurements of water quality parameters (chlorophyll-a concentration,
    turbidity, and TSS) for selected lakes
