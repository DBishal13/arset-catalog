summary: This ARSET training introduces bottom-up and top-down methods for tracking emissions and removals
  of carbon dioxide and methane from the atmosphere.
description: 'To support the 2023 Global Stocktake (GST), parties to the Paris Agreement compiled inventories
  of anthropogenic greenhouse gas (GHG) emissions and removals to assess their collective progress towards
  the long-term objectives of the Agreement. The Global Stocktake is the process of monitoring the implementation
  of the Paris Agreement. The outcome of the GST provides Parties with the information needed to update
  and enhance their nationally determined contributions (NDCs) to the global response to climate change
  and strengthen international cooperation for climate action.


  This three-part training hosted by NASA''s Applied Remote Sensing Training Program (ARSET) introduces
  bottom-up and top-down methods for tracking emissions and removals of carbon dioxide (CO2) and methane
  (CH4) from the atmosphere. This training explores how to combine this information to produce a more
  complete and transparent global stocktake and support efforts to reduce net emissions and mitigate their
  impact on the climate.


  Demonstrations show how top-down atmospheric budgets of CO2 and CH4 can be derived from atmospheric
  measurements and inverse models to produce a transparent description of their emissions and removals.
  Participants are introduced to pilot products and how information contained in these top-down atmospheric
  products can supplement bottom-up inventory products to assess the accuracy and completeness of emissions
  reports on regional, national, and local scales.'
objectives:
- Recognize the need to monitor CO2, CH4, and other greenhouse gases to support efforts to reduce net
  emissions and mitigate their impact on climate
- Describe how top-down CO2 and CH4 budgets can be derived using atmospheric measurements and inverse
  models
- Relate how the products and methods described can be combined with bottom-up inventories to identify
  opportunities for improving GHG inventories to support future GSTs.
audience:
- This webinar series is intended for stakeholders at local, regional, and national levels who are interested
  in managing greenhouse gas emissions to meet the climate change mitigation goals of the Paris Agreement,
  national inventory developers, and researchers who are interested in developing top-down atmospheric
  greenhouse gas budgets and working with the inventory development and assessment communities to support
  the global stocktake process.
