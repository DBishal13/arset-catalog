summary: This ARSET training covers how to access and analyze TROPOMI data as well as its applications.
description: 'Nitrogen dioxide (NO 2) is unhealthy to breathe and is a necessary ingredient for the formation
  of unhealthy levels of surface ozone. NASA Aura''s Ozone Monitoring Instrument (OMI) instrument has
  been monitoring NO 2 data since 2004 and has been used in a variety of health and air quality applications.
  The Tropospheric Monitoring Instrument (TROPOMI) instrument aboard Sentinel-5P, launched in 2017, represents
  a significant improvement in spatial resolution over OMI. It will be better-suited for many applications
  currently using OMI data, including monitoring air pollution.


  In this advanced training led by NASA''s Applied Remote Sensing Training Program (ARSET), attendees
  learned how to access and analyze TROPOMI data and about its applications.'
objectives:
- Understand the available data products
- Access and download TROPOMI data
- Analyze the data using Python tools
audience:
- This webinar is intended for end-users who are already familiar with satellite observation capabilities
  and have used online image archives or analysis tools at basic to intermediate levels for air quality
  applications, such as emissions estimation using satellite observations.
