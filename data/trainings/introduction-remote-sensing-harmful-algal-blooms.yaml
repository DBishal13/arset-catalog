summary: This ARSET training covers how to use remote sensing to identify impaired water quality from
  harmful algal blooms.
description: 'Harmful algal blooms (HABs) can have a negative impact on the ecosystem and human health.
  Satellite remote sensing is able to collect data frequently and over a large area to identify impaired
  water quality from HABs.


  This data can help decision makers decide where to take water samples, determine what toxins are in
  the water, decide whether they need to change or move drinking water intakes, and decide whether a fishery
  needs to be closed. Remote sensing data also enables individuals and organizations to have more flexible
  plans for water sampling and leads to a more efficient and appropriate allocation of resources for protecting
  human health.'
objectives:
- Identify NASA’s Earth Science remote sensing data products for the identification and monitoring of
  HABs
- Describe how coupled remote sensing and modeling approaches are used in decision support tools
- Use a selection of NASA Earth Science data tools to monitor HABs
audience:
- Local, regional, state, federal, and international organizations interested in using satellite imagery
  for coastal and ocean applications.
applications:
- water-resources
