summary: This ARSET training covers using SAR from Sentinel-1 and optical imagery from Sentinel-2 to map
  crop types and assess biophysical characteristics.
description: 'For years, mapping of crop types and assessment of their characteristics has been carried
  out to monitor food security, inform optimal use of the landscape, and contribute to agricultural policy.
  High-quality crop mapping has become a requirement for most nations given its importance in national
  and international economics, trade, and food security, and is a major topic of interest in the domains
  of policy, economics, and land management.


  Most countries or economic regions currently and increasingly use freely available satellite imagery
  for crop type classification and biophysical variable assessment as they provide a synoptic view, multi-temporal
  coverage, and are cost-effective. Remote sensing methods based on optical and/or microwave sensors have
  become an important means of extracting crop information as they explain vegetation structure and biochemical
  properties.


  This five-part, intermediate webinar series focuses on the use of synthetic aperture radar (SAR) from
  Sentinel-1 and/or optical imagery from Sentinel-2 to map crop types and assess their biophysical characteristics.
  The webinar covers a SAR and optical refresher along with pre-processing and analysis of Sentinel-1
  and Sentinel-2 data using the Sentinel Application Platform (SNAP) and Python code written in JupyterLab,
  a web-based interactive development environment for scientific computing and machine learning.


  The webinar also covers an operational roadmap for mapping crop type, including best practices for collecting
  field data to train and validate models for classifying crops on a national level. The final session
  of this series covers crop biophysical variable retrievals using optical data.


  This training series is a collaboration between NASA’s Applied Remote Sensing Training Program (ARSET),
  Agriculture and Agri-Food Canada (AAFC), European Space Agency (ESA), Indian Space Research Organization
  (ISRO), United Nations Office for Outer Space Affairs (UNOOSA), and the CEOS Working Group on Capacity
  Building & Data Democracy (WGCapD).'
objectives:
- The information content in passive (optical) and active (microwave) remote sensing data and how it relates
  to agricultural parameters
- The characteristics of passive and/or active sensors used in operational crop mapping and biophysical
  retrievals
- Where to acquire satellite data for conducting agricultural analysis
- The steps for pre-processing optical and radar imagery
- The steps to classify crop types using supervised and unsupervised techniques and explain the difference
  among classifiers (e.g., Decision Tree and Random Forest)
- Best practices for collecting field-based training data
- Retrieval of crop biophysical variables
audience:
- This training series is intended for local, regional, federal, and non-governmental organizations from
  agriculture and food security related agencies to use radar and optical remote sensing applications
  in the domain of agriculture for crop type mapping.
