summary: This ARSET training covers change detection methods, including image subtraction, classification,
  and analysis.
description: 'Land cover changes can impact many areas of life. These changes can affect deforestation,
  ecological communities, wildfire extent, and urban growth. This advanced training series led by NASA''s
  Applied Remote Sensing Training Program (ARSET) focused on using satellite imagery to map changes in
  land cover.


  Attendees learned change detection methods including image subtraction and classification. They also
  conducted their own change detection analysis. This training used QGIS, the R statistical program, and
  the Random Forest algorithm. Both sessions featured a lecture and hands-on exercises.'
objectives:
- Become familiar with Landsat bands and color combinations
- Understand how to visualize change in land cover using Landsat data
- 'Learn the basic steps for change detection by: Conducting image subtraction between two dates using
  QGIS Creating multi-date Landsat layer stacks Conducting multi-date land cover classification using
  the Random Forest classification in R Identifying and analyzing changes in land cover'
- Conducting image subtraction between two dates using QGIS
- Creating multi-date Landsat layer stacks
- Conducting multi-date land cover classification using the Random Forest classification in R
- Identifying and analyzing changes in land cover
audience:
- This training is for local, regional, state, federal, and international organizations interested in
  assessing vegetation conditions and analyzing land cover changes using satellite imagery.
