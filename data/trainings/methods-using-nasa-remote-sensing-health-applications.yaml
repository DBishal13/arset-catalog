summary: This ARSET training focuses on how to access and apply NASA data relevant to public health.
description: 'Every year, environmental conditions adversely affect the health of millions of people.
  Environmental data can be combined with public health information to predict and monitor potentially
  dangerous environmental health events, such as disease outbreaks, harmful algal blooms, excessive heat,
  airborne allergens, and low air quality.


  In this advanced webinar led by NASA''s Applied Remote Sensing Training Program (ARSET), participants
  learn how to access and apply NASA data relevant to public health. The webinar includes a presentation
  on tools available for evaluating the relationship between environmental conditions and health outcomes,
  followed by lectures on pollen dispersal and heat stress mitigation. Two homework assignments will give
  participants an opportunity to review and practice what they have learned during the presentations.'
objectives:
- Use satellite remote sensing to increase their knowledge in environmental health research
- Complete original homework problem dealing health and environmental satellite data
- Identify which satellite data sources that could be used in their research.
audience:
- Public health professionals and decision makers from local, state, federal, and international agencies,
  non-governmental organizations (NGOs), and the private sector.
