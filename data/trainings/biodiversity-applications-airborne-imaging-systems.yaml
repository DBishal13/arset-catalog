summary: This ARSET training highlights the use of hyperspectral data for measuring and monitoring terrestrial
  and aquatic biodiversity.
description: 'Effective monitoring and management of critically important and biodiverse ecosystems requires
  a comprehensive suite of data and analysis tools. The use of NASA Earth Observations (EO), in particular
  the combination of multispectral and hyperspectral optical imagery, thermal infrared data, and laser
  altimeter (LiDAR) data, can provide an increased understanding of ecosystem function.


  This training series highlights the use of hyperspectral Visible to Shortwave Infrared (VSWIR) imaging
  spectroscopy data, for example from Airborne Visible InfraRed Imaging Spectrometer - Next Generation
  (AVIRIS-NG) and Portable Remote Imaging SpectroMeter (PRISM) instruments, for measuring and monitoring
  terrestrial and aquatic biodiversity (e.g., mapping plant or phytoplankton functional types). The series
  focuses on using thermal and LiDAR data for characterizing the structure and function of ecosystems
  using airborne campaigns including the Hyperspectral Thermal Emission Spectrometer (HyTES) and NASA''s
  Land, Vegetation, and Ice Sensor (LVIS). This training also prepares participants to use data from upcoming
  NASA satellite missions and airborne campaigns such as the much-anticipated Surface Biology and Geology
  (SBG) mission and the NASA Biodiversity field campaign in the Greater Cape Floristic Region of South
  Africa (BioSCape).'
