published: '2017-07-12'
last_updated: '2026-02-11'
summary: This ARSET training provides an overview of drought classification and web-based tools for drought
  monitoring and visualization.
description: Prolonged drought can result in economic, environmental, and health-related impacts. In this
  training, participants can learn how to monitor drought conditions and assess impacts on the ecosystem
  using precipitation, soil moisture, and vegetation data. The training provides an overview of drought
  classification, as well as an introduction to web-based tools for drought monitoring and visualization.
objectives:
- Understand how remote sensing can be used for drought monitoring
- Acquire remotely-sensed imagery and products for drought
- Analyze drought data and calculate anomalies within a geospatial software
audience:
- This training is for regional, state, federal, and international organizations interested in using remote
  sensing to monitor drought. Professional organizations in the public and private sectors engaged in
  environmental management and monitoring will be given preference over organizations focused primarily
  on research.
