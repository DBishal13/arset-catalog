summary: This ARSET training focuses on agriculture and flood applications of synthetic aperture radar
  (SAR) data.
description: This webinar series, led by NASA's Applied Remote Sensing Training (ARSET) program, builds
  on the knowledge and skills previously developed in ARSET synthetic aperture radar (SAR) trainings.
  Presentations and demonstrations focus on agriculture and flood applications. Participants can learn
  to characterize floods with Google Earth Engine and learn to analyze SAR data for agricultural applications,
  including retrieving soil moisture and identifying crop types.
objectives:
- Analyze SAR data in Google Earth Engine
- Generate soil moisture analyses
- Identify different types of crops.
audience:
- The target audiences for this training are local, regional, state, federal, and international organizations
  interested in using satellite imagery for agricultural and flood related applications.
