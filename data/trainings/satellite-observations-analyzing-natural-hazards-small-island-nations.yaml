summary: This ARSET training introduces data, methods, and tools useful for monitoring natural hazards
  on small island nations.
description: 'Small island nations are highly vulnerable to climate change and natural disasters; among
  them hurricanes, cyclones, and other violent storms. These disasters can lead to severe flooding, landslides,
  and, in the worst cases, can result in the loss of life and property. In addition, a rise in the global
  mean sea level places island nations at a higher risk for permanent submersion of land, coastal erosion,
  coastal ecosystem loss or change, salinization, and impeded drainage.


  This three-part training series focuses on small island nations while introducing the data, methods,
  and tools useful for monitoring natural hazards. Case studies are used to demonstrate methodologies
  applying satellite and model data and open access tools to analyze storm impacts, sea level rise, and
  landslides on small island nations.


  This training is offered byNASA''s Applied Remote Sensing Training (ARSET) program in collaboration
  with the Caribbean Center for Rising Seas.'
objectives:
- Recognize the applications of passive and active remote sensing for flooding, landslides, and sea level
  rise
- Perform an analysis pre- and post-storm event for a region of interest
- Assess the landslide hazard for a region of interest prior to and during an event
- Interpret satellite-derived products for characterizing sea level rise on a regional scale.
audience:
- This training is primarily intended for local, regional, state, federal, and international organizations
  involved in pre, during, or post disaster assessment in small island nations.
