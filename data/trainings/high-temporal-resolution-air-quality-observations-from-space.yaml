summary: This ARSET training introduces satellites with a high temporal resolution for air quality applications.
description: For certain applications some satellites take too long to revisit the same spot. Some satellites
  are capable of consistent monitoring of the same area. This training series, led by NASA's Applied Remote
  Sensing Training (ARSET) program, covers satellites with a high temporal resolution for air quality
  applications. Participants can learn about new and upcoming geostationary satellites, what data is available,
  and how to access them. The training covers satellites over the Americas, Asia, and Africa, and feature
  speakers from the National Oceanic and Atmospheric Administration (NOAA), Yonsei University, and the
  Indian Institute of Remote Sensing.
objectives:
- Understand the difference between polar orbiting and geostationary satellites
- Recognize current and upcoming geostationary satellites
- Access air quality datasets.
audience:
- This training is designed for local, state and federal environmental monitoring agencies in the Americas,
  Asia-Pacific, and Africa.
