summary: This ARSET training introduces remote sensing for coastal and ocean applications.
description: In this introductory course hosted by NASA's Applied Remote Sensing Training Program (ARSET),
  participants are provided with an overview of remote sensing for coastal and ocean applications. This
  includes a background in aquatic remote sensing, data access and tools for processing and analyzing
  imagery, and examples and live demonstrations of tools that have been developed for NASA and partner
  organizations. This course covers data products from the Moderate Resolution Imaging Spectroradiometer
  (MODIS), Visible Infrared Imaging Radiometer Suite (VIIRS), Hyperspectral Imager for the Coastal Ocean
  (HICO), and other sensors commonly used for ocean applications.
objectives:
- A basic understanding of remote sensing in aquatic environments
- How to access and visualize relevant NASA Earth Science data
- Techniques for using NASA Earth Science data for coastal and ocean applications in the areas of animal
  migrations and coral reef health
audience:
- This training is for local, regional, state, federal, and international organizations interested in
  using satellite imagery for coastal and ocean applications. Governmental and non-governmental organizations
  in the public and private sector engaged in environmental management and monitoring.
