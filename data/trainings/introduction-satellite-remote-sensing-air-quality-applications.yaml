start_date: '2016-07-06'
end_date: '2016-08-03'
published: '2016-07-06'
last_updated: '2026-03-02'
summary: This ARSET training provides an overview of the remote sensing process, data products, and their
  use in air quality applications.
description: 'This introductory training series provided a brief overview of some of the fundamentals
  essential to understanding the remote sensing process, data products, and their use in air quality applications.
  This training led by NASA''s Applied Remote Sensing Training Program (ARSET) was specifically targeted
  at participants of the in-person workshops at the 17th IUAPPA World Clean Air Congress, the 9th CAA
  Better Air Quality Conference, and the Atmospheric Optics: Aerosols, Visibility, and the Radiative Balance
  Conference.'
objectives:
- Understand some of the basics of satellite remote sensing of aerosols and trace gases
- Be able to access limited satellite images and data using online tools
- Become familiar with remote sensing terminology.
audience:
- National and international entities involved in air quality management and professionals interested
  in implementing satellite capabilities for decision support activities.
prerequisites:
- fundamentals-remote-sensing
applications:
- health-air-quality
