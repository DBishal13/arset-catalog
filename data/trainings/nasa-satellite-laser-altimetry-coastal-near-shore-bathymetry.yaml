summary: This ARSET training covers NASA data providing near global coverage of coastal and near-shore
  satellite-derived bathymetry (SDB) measurements.
description: This two-part training focused on NASA data providing near global coverage of coastal and
  near-shore satellite-derived bathymetry (SDB) measurements from the Advanced Topographic Laser Altimeter
  System (ATLAS) instrument — a space-based lidar instrument flying on the Ice, Cloud, and land Elevation
  Satellite 2 (ICESat-2) platform. ATLAS’s green wavelength, photon-counting lidar signal can reach depths
  of up to 40 meters in regions with adequate water clarity to provide shallow, near-shore bathymetric
  data for a range of applications, including coastal and marine science management, nearshore habitat
  research, marine navigation, and engineering applications. The ATL24 product provides near global along-track
  coastal and nearshore SDB, consisting of refraction-corrected seafloor and sea surface heights, as well
  as associated uncertainties. This Applied Remote Sensing Training Program (ARSET) training improved
  users' knowledge of ICESat-2, the ATL24 product, and how to access, plot, and analyze ICESat-2 bathymetry
  data.
objectives:
- Identify NASA bathymetry data used for global coastal and near-shore bathymetry mapping for risk reduction
  relating to shipping and navigation.
- Identify the applications and limitations of ICESat-2 bathymetry data (ATL24) for coastal and near-shore
  bathymetry mapping.
- Plot and download ICESat-2 bathymetry data (ATL24) using SlideRule Web Client.
- Analyze ICESat-2 bathymetry data (ATL24) using SlideRule Python Client.
audience:
- Remote sensing scientists and geospatial analysts public (local, regional, and federal), private industry,
  and international institutions who use satellite altimetry for bathymetric applications pertaining to
  risk reduction in coastal and near-shore waters.
- Academics and researchers interested in satellite-derived bathymetry.
