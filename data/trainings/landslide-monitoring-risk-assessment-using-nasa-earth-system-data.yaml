summary: This ARSET training teaches participants how satellite-based Earth observations can inform landslide
  science and disaster planning.
description: 'This three-part introductory training covers a number of topics relating to landslides,
  demonstrating a wide variety of NASA Earth science data uses to characterize landslides and their impacts.
  The training provides the scientific background of landslides to answer important questions such as:
  What is a landslide? Where do they occur? What causes them, and why?


  Participants learn how satellite-based Earth observations can inform landslide science and disaster
  planning with a focus on key observations and model data, including optical and synthetic aperture radar
  (SAR) based analysis. The training includes information on how NASA data and models can be used to automate
  landslide detection to rapidly map where landslides have occurred post-disaster using the NASA SALaD
  model (Semi-Automatic Landslide Detection).


  The training also covers how satellite-based Earth observations can better predict the location and
  timing of landslides using the global LHASA model (Landslide Hazard Assessment model for Situational
  Awareness). These open source tools can help communities prepare for and respond to landslides all over
  the world.'
