summary: This ARSET training provides an overview of animal tracking sensors, NASA's history of animal
  tracking, and NASA's Internet of Animals project.
description: 'Animals are sentinels of environmental change, and animal telemetry is a commonly used tool
  to quantify habitat use and help understand environmental changes. NASA data can be used to characterize
  the environmental parameters that infer the habitats that animals use.


  This training course will provide participants with an overview of animal tracking sensors, NASA’s history
  of animal tracking, NASA’s Internet of Animals project, and the types of remote sensing data that can
  be paired with animal telemetry. Because animal telemetry collects frequent animal location data, it
  is important to consider time-matched remote sensing in data analyses. In remote marine environments,
  for example, Level 3 and Level 4 products provide the most complete spatiotemporal coverage, such as
  Ocean Surface Current Analyses Real-time (OSCAR) for ocean surface currents.


  Participants will then learn how to integrate telemetry and remote sensing data by applying a basic
  data standardization process to animal tracking data, visualizing the animals’ distribution via home
  ranges with utilization distributions, downloading remote sensing data, and characterizing animals’
  habitats in a species distribution model to infer habitat use. The balance of tradeoffs (spatiotemporal
  mismatches; computational power and time) from pairing remotely sensed data with animal tracks will
  be discussed. Examples for both marine and terrestrial environments will be provided.'
