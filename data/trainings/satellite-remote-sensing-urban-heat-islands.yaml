summary: This ARSET training covers the use of remote sensing in determining and explaining urban heat
  islands, and ways to mitigate the effects.
description: 'The rapid growth of urban populations, the urban heat island (UHI) effect, and a potential
  increase in the frequency and duration of heat waves due to climate change raise a series of issues
  about the increased health risks of sensitive urban populations to extreme heat and the effective means
  of mitigating impacts of heat waves.


  According to the U.S. Environmental Protection Agency (EPA), urban heat islands affect energy consumption,
  elevate greenhouse gas emissions, and impair water quality by increasing the temperature of urban water
  runoff. This Applied Remote Sensing Training program (ARSET) training is in collaboration with the National
  Integrated Heat Health Information System (NIHHIS) and the Global Heat Health Information Network (GHHIN).


  This training addresses the use of remote sensing in determining where "hot spots" of land surface temperature
  are located in urban areas, why these areas are experiencing increased temperature, which populations
  are most vulnerable, and ways to mitigate the effects through adaptive land use planning.'
objectives:
- Define what an urban heat island (UHI) is and why it matters to urban planners and public health experts
- Identify which satellites and sensors can be used for assessing UHI
- Give examples of populations that are especially susceptible to heat stress
- Summarize the limitations of satellite data for understanding UHI
- Recognize new methods that incorporate conventional satellite remote sensing data and in situ observations
  of temperature and humidity from community science and urban field campaigns
- List what landscape features help to explain variations in urban heat islands
- Compute land surface temperature from Landsat 4, 5, 7, and 8 within Google Earth Engine.
audience:
- Community, municipal, city, state, federal, and private institutions involved in urban planning, health
  care, energy supply and demand management, and climate mitigation.
