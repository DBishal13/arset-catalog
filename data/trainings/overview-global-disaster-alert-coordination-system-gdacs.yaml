summary: This ARSET training teaches how to use the GDACS to monitor disasters, assess impacts, and develop
  response strategies.
description: 'Up-to-date and accessible information is essential to providing an effective, coordinated
  response to disasters, such as earthquakes, floods, and tropical storms. The Global Disaster Alert and
  Coordination System (GDACS) provides near real-time data, alerts, and impact assessments that can be
  accessed online. The interactive website integrates coordination tools with maps and satellite imagery
  relevant to an event, including NASA satellite imagery and Moderate Resolution Imaging Spectroradiometer
  (MODIS)-based flood mapping from the Dartmouth Flood Observatory.


  In this two-hour training, participants learned how to use GDACS to monitor real-time disasters, assess
  the impacts of an event, and develop response strategies for both national and international events.
  The training led by NASA''s Applied Remote Sensing Training program (ARSET) included a presentation,
  followed by a demonstration of GDACS features and a case study with step-by-step instructions for obtaining
  satellite images, alerts, and crisis management information using GDACS.'
objectives:
- Monitor real-time disasters using satellite images and maps
- Use geographic information system (GIS)-based and in situ information to inform impact assessments and
  response strategies
audience:
- This training is for disaster managers, emergency and relief organizations, and nongovernmental organizations
  operating on local to international levels. Professional organizations in the public and private sectors
  engaged in disaster management and relief will be given preference over organizations focused primarily
  on research.
