summary: This ARSET training focuses on mapping and monitoring mangroves and how it aligns with UN Sustainable
  Development Goals (SDGs).
description: 'This training focuses on mapping and monitoring mangroves and how they relate to United
  Nations (UN) sustainable development indicator 6.6.1: Change in the extent of water-related ecosystems
  over time. Indicator 6.6.1 is used in determining progress toward meeting Sustainable Development Goal
  (SDG) 6, which is to “Ensure availability and sustainable management of water and sanitation for all.”


  Understanding mangrove ecosystems and mapping their extent is critical to meeting this goal. Mangroves
  are critical ecosystems, provide coastal protection from storm surges, maintain our climate, control
  floods, and stabilize coastlines. Additionally, they serve as nurseries for a number of marine wildlife
  species. Mangroves are also integral to the blue carbon family. Blue carbon is carbon stored, sequestered,
  or released from coastal vegetation ecosystems (Heer et al. 2012). Therefore, understanding mangrove
  extent and biomass is essential to managing the sustainability of our water ecosystems.


  In this Applied Remote Sensing Training Program (ARSET) training, participants learn about the latest
  tools for mapping mangrove extent in Google Earth Engine (GEE) and how these observations can be used
  to report towards SDG quotas.'
objectives:
- Understand Sustainable Development Goals with a focus on understanding SDG 6.6.1
- Understand the importance of mangrove ecosystems and the need for mapping them using satellite technology
- Have knowledge of spatial data that is available for studying mangrove ecosystems
- 'Use Google Earth Engine to: Map country-specific mangrove extent (Case Study: Guyana) Perform a time
  series analysis of mangrove ecosystems Calculate mangrove extent in hectares Build an app to display
  data using results from Guyana'
- 'Map country-specific mangrove extent (Case Study: Guyana)'
- Perform a time series analysis of mangrove ecosystems
- Calculate mangrove extent in hectares
- Build an app to display data using results from Guyana
audience:
- National policymakers involved in sustainable development commitments to mangrove and water-related
  ecosystem conservation and the UN’s SDGs.
