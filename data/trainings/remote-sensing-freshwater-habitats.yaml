summary: This ARSET training guides participants through using Earth observations for habitat monitoring,
  specifically for freshwater fish and other species.
description: 'Freshwater habitats play an important role in ecological function and biodiversity. Remote
  sensing of these ecosystems is primarily tied to observations of the drivers of biodiversity and ecosystem
  health. Remote sensing can be used to understand things such as land use and land cover change in a
  watershed, habitat connectivity along a water body, water body location and extent, and water quality
  parameters.


  This training series led by NASA''s Applied Remote Sensing Training program (ARSET) guides participants
  through using NASA Earth observations for habitat monitoring, specifically for freshwater fish and other
  species. This training also provides a conceptual overview as well as the tools and techniques for applying
  landscape environmental variables to genetic and habitat diversity in species.


  Relevant UN Sustainable Development Goals: 6.6, 14.2'
objectives:
- Understand the limitations of using remote sensing for freshwater habitats
- Find data and models that can be used in their landscape genetics and habitat monitoring work
- See how remote sensing can be used for habitat restoration, ecological assessments, and climate change
  assessments relating to freshwater systems
- Be able to use the Riverscape Analysis Project decision support system
- Be familiar with the Freshwater Health Index
audience:
- This training is for local, regional, state, federal, and non-governmental organizations involved in
  conservation, habitat restoration, freshwater health, and riparian landscapes.
