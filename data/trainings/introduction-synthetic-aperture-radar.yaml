summary: This ARSET training focuses on building the skills needed to acquire and understand synthetic
  aperture radar data as well as potential applications.
description: 'A limitation of optical satellite remote sensing is that it depends on cloudless, well-illuminated
  areas to produce quality data. This is especially problematic for collecting data during nighttime,
  around storms, and in densely-forested areas. Synthetic aperture radar (SAR) is a solution for many
  of these obstacles.


  SAR can observe Earth''s surface day and night, through most weather conditions, and the signal can
  penetrate the vegetation canopy. There are a number of existing SAR datasets from current and past airborne
  and satellite missions as well as exciting upcoming missions.


  This online training led by NASA''s Applied Remote Sensing Training program (ARSET) focuses on building
  the skills needed to acquire and understand SAR data, including polarimetric and interferometric SAR
  (PolSAR and InSAR) as well as potential applications.'
objectives:
- Interpret the information in SAR images
- Recognize distortions that need to be corrected in SAR images
- Describe the basics of PolSAR and the information provided by different polarizations
- Describe the basics of InSAR and the information in an interferogram
audience:
- This training is for remote sensing users from local, regional, state, federal, and international organizations
  interested in using SAR for terrestrial applications such as inundation mapping, fire scar detection,
  land cover land use change studies, or surface deformation.
