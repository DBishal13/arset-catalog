summary: This ARSET training focuses on global and regional lightning data products that can be used for
  disaster risk preparedness.
description: 'It is well-documented that there are approximately 24,000 worldwide fatalities from lightning
  each year, with about 10 times more being injured from lightning (NIH-NCBI). In addition, lightning
  strikes are one of the leading causes of wildfire ignition. During storms, lightning strikes on trees,
  utility poles, and infrastructure, can damage power lines resulting in power outages. Lightning flashes
  also generate electromagnetic fields (Sferics) that interfere with electrical devices on ground.


  As the intensity and frequency of extreme weather events are likely to increase due to climate change
  impacts, lightning activity will likely increase as well, causing more power outages, increased risks
  of wildfire ignition, and increased numbers of injuries and fatalities. Therefore, information about
  lightning activity is critical for better preparedness against these disasters. This three-part, introductory
  training focuses on global and regional lightning data products that can be applied to disaster risk
  preparedness.'
