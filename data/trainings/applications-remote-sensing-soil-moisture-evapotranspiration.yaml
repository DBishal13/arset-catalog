summary: This ARSET training covers NASA soil moisture and evapotranspiration products and how to access
  and apply them for water resource management.
description: 'Previous Applied Remote Sensing Training Program (ARSET) trainings focused on water resources
  have mainly addressed remote sensing measurements of precipitation and their applications, but precipitation
  is only one component of the water cycle. NASA''s Soil Moisture Active Passive (SMAP) platform is now
  providing new soil moisture data, and modeling frameworks are providing new evapotranspiration data.


  This webinar series was intended to help attendees learn about NASA soil moisture and evapotranspiration
  products and how to access and apply them for water resource management. Throughout the five sessions
  you will learn how to monitor and manage water resources with techniques learned in training.


  The series begins with an introduction to satellite missions and useful datasets. Next, trainers demonstrate
  online portals for accessing data. The series concludes with specific examples of how you can apply
  the data and modeled data products.'
objectives:
- Participants will learn about NASA Earth observation resources (data and tools) available for water
  resource applications, including a basic understanding of how evapotranspiration and soil moisture are
  included in the water cycle and how to access and visualize these data products.
- Participants will also become familiar with a number of modeled datasets and techniques for using NASA
  Earth Science data for water resource management.
audience:
- Local, regional, state, federal, and international organizations interested in using satellite imagery
  for decision and policy making activities.
