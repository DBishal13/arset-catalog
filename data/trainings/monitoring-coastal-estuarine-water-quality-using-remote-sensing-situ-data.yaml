summary: This ARSET training provides participants with the skills to combine in situ measurements and
  optical remote sensing data to assess water quality.
description: 'This two-part, advanced webinar series led by NASA''s Applied Remote Sensing Training program
  (ARSET) was a follow-on to the training on coastal and estuarine water quality held in September 2021.
  It is a hands-on training with demos provided by instructors, followed by an hour of lab time for participants
  to use Level-1 Moderate Resolution Imaging Spectroradiometer (MODIS) and Visible Infrared Imaging Radiometer
  Suite (VIIRS) data provided by the Ocean Biology DAAC (OB.DAAC) and the Sea, earth, atmosphere Data
  Analysis System (SeaDAS) and OCSSW software for deriving water quality parameters.


  The derived water quality parameters include chlorophyll-a concentration, sea surface temperature, and
  suspended particulate matter from optical satellite imagery and in situ measurements using the SeaWiFS
  Bio-optical Archive and Storage System (SeaBASS), a public repository of in situ oceanographic and atmospheric
  data, and SeaDAS, a comprehensive software package for the processing, display, analysis, and quality
  control of remote sensing data.


  This training provides participants with the skills to combine in situ measurements and optical remote
  sensing data to assess water quality for their area of interest.'
objectives:
- Select in situ water quality data from SeaBASS
- Develop algorithms from MODIS and VIIRS imagery using SeaDAS to obtain chlorophyll-a, sea surface temperature,
  and suspended particulate matter
- Monitor water quality in selected coastal and estuarine regions
audience:
- This training series is intended for federal, state, regional, and local public and private organizations
  involved in water quality and estuarine ecosystem management.
