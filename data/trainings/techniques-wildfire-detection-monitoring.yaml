summary: This ARSET training highlights satellite remote sensing data useful for local fire managers.
description: With more frequent and severe droughts, certain areas are experiencing longer fire seasons.
  Wildfire detection, monitoring, and mitigation is increasingly important in these regions. Satellite
  remote sensing data is useful for identifying active fires, evaluating burned areas, and assessing fire
  emissions. This advanced training highlights tools useful for local fire managers. Presentations and
  exercises introduce participants to tools to identify active fires, visualize fire emissions, and calculate
  burn severity.
objectives:
- Identify active fires, visualize fire emissions, and calculate burn severity
- Use the QGIS FMT to enter fire information and order imagery
audience:
- This training is primarily intended for local, regional, state, federal, and international organizations
  involved in wildfire management.
