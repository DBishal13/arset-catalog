summary: This ARSET training reviews pre-fire risk assessment and post-fire mapping using open-source
  tools like Google Earth Engine.
description: 'Record-breaking fire seasons, like those we saw in California in 2020, demonstrate how climate
  change influences the risk and severity of fires on a global scale. Climate change impacts can increase
  fire frequency, disrupt historical fire regimes, and contribute to increases in fire intensity and burn
  severity. Therefore, assessments of fire risk and post-fire mapping and monitoring are vital for effective
  management and decision-making.


  This Applied Remote Sensing Training Program (ARSET) training consists of two sessions with hands-on
  exercises and “lab time,” where participants complete exercises with instructors online to answer questions
  as they come up. During the first session, we review pre-fire risk assessment by investigating land
  surface variables (e.g., vegetation type and height, fuel regimes, fuel moisture, and topography) and
  climate variables (e.g., temperature and precipitation). In the second session, we conduct post-fire
  mapping of burned area and burn severity using vegetation indices such as the Normalized Burn Ratio
  (NBR). Methods include the use of open-source tools such as Google Earth Engine and NASA-supported platforms
  such as the SERVIR Global Service Catalog to analyze imagery.


  Before attending this training, we highly recommend you create a Google Earth Engine (GEE) account so
  you can be fully engaged with the exercises and demonstrations. Please note that our instructors may
  not be able to troubleshoot your individual code.'
objectives:
- Identify land cover and climate variables related to wildfire risk
- Access and display geospatial wildfire risk data layers
- Create a burn severity map using satellite imagery
- Calculate burned area using satellite imagery
audience:
- Local, regional, state, federal, and non-governmental organizations involved in land management, fire
  risk assessment, and post-fire landscape evaluation; applied scientists and Geographic Information Systems
  (GIS) professionals interested in learning how to complete fire-related assessments independently.
