summary: This ARSET training focuses on the use of InSAR data from NISAR and surface displacement products
  from OPERA to monitor ground movements.
description: 'Small changes in Earth’s surface can serve as early indicators of potential natural hazards.
  For example, subtle ground movements may signal areas at risk of landslides, volcanic activity, or earthquakes.
  Additionally, measuring the extent of surface displacement after an earthquake can help assess both
  the magnitude of the event and the areas affected, including regions that may have been damaged or destroyed.


  These measurements are made possible through Interferometric Synthetic Aperture Radar (InSAR), which
  is a technique that NASA/ISRO (Indian Space Research Organization) Synthetic Aperture Radar (NISAR)
  is specifically designed to support. In addition, displacement products based on InSAR are being developed
  and made available through NASA’s Observational Products for End-Users from Remote Sensing Analysis
  (OPERA) project.


  This intermediate, two-part training will focus on the use of InSAR data from NISAR and surface displacement
  products from OPERA to monitor ground movements and assess areas at risk of landslides, earthquakes,
  and other natural hazards. The training will also include demonstrations on how to use these data products
  to evaluate regions that may have been damaged by seismic events.'
objectives:
- Identify the core capabilities and mechanisms of InSAR that make it uniquely suited for measuring surface
  displacement compared to other remote sensing methods.
- Recognize the common limitations, uncertainties, and potential sources of error associated with L-band
  InSAR.
- Select the most appropriate NISAR or OPERA surface displacement product to monitor ground movement in
  order to assess a specific natural hazard scenario (e.g., landslide, earthquake, or volcanic activity).
- Apply a workflow to access, visualize, and process time-series NISAR surface displacement products for
  disaster assessment related to earthquakes, landslides, and volcanoes.
- Interpret NISAR time-series surface displacement data products to determine the extent and magnitude
  of ground movement related to earthquakes, volcanoes, and natural hazards.
- Access and analyze OPERA surface displacement products for earthquakes, volcanoes, and natural hazards.
audience:
- Disaster response managers from federal, state, and local government agencies, NGOs, and from private
  sector organizations, both domestically and internationally.
- Students and academics who are interested in radar remote sensing for disaster extent and risk.
