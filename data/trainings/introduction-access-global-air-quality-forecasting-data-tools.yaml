summary: This ARSET training discusses the basics of air quality (AQ) forecasting, including how to access
  and interpret global AQ forecasts.
description: This training led by NASA's Applied Remote Sensing Training (ARSET) program focuses on NASA
  and European Center for Medium-Range Weather Forecasts (ECMWF) global air quality (AQ) forecasting capabilities.
  Delivered in collaboration with the Copernicus Atmosphere Monitoring Service (CAMS), this training discusses
  the basics of AQ forecasting and teaches users how to access and interpret global air quality forecasts.
audience:
- This training is primarily intended for local, regional, state, federal, and international organizations
  involved in air quality management and forecasting, and those with an interest in applying remote sensing
  and global models for air quality applications.
