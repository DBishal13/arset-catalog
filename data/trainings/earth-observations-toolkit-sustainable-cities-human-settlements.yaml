sessions:
- part: 1
  title: Introduction to the EO Toolkit for Sustainable Cities and Human Settlements
  agenda:
  - Overview of Sustainable Development Goal 11 and the New Urban Agenda.
  - Background and introduction to the main components of the Earth Observations Toolkit for Sustainable
    Cities and Human Settlements.
  - The role of Earth observations in monitoring and informing operations and planning for cities and
    other types of human settlements.
