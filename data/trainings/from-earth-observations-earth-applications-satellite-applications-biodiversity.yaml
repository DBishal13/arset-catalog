published: '2016-09-04'
last_updated: '2026-02-02'
summary: This ARSET training introduces how to use Earth observations to inform conservation policy and
  management.
description: Satellite-based Earth observations provide a transparent, repeatable, and cost-effective
  method for global monitoring of natural resources. These observations are critical to inform conservation
  management and provide valuable input to policy tools such as the Convention on Biological Diversity
  Aichi Biodiversity Targets, the International Union for Conservation of Nature (IUCN) Red List of Threatened
  Species, the IUCN Red List of Ecosystems, and other climate change and sustainable development conventions.
  This conservation campus provided an overview of satellite remote sensing for conservation decision-makers
  and provided specific applications and hands-on demonstrations of how to use Earth observations to inform
  conservation policy and management.
objectives:
- Understand the basics of satellite remote sensing and its application to the conservation of biodiversity,
  natural resource management, and ecosystem services
- Become familiar with open and freely available web tools used for Earth observations that can contribute
  to conservation objectives
audience:
- This course was designed for a broad audience, including resource managers and policy makers that are
  interested in learning the basic concepts of remote sensing and apply them directly to conservation
  goals.
