- part: 3
  title: Training & Testing ML Models for Irregularly-Spaced Time Series of Imagery
  agenda:
  - Perform the process to set up and train a 1-D convolutional neural network (CNN) model that learns
    to detect crop-type from a satellite image
  - Follow steps to monitor model performance during training and how to choose appropriate hyperparameter
    adjustments
  - Plot predictions to validate performance after training
  - To be completed before starting individual learning exercises and the homework assignment.
