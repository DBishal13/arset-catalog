sessions:
- part: 1
  title: Data Preparation of Imagery for Large-Scale ML Modeling
  agenda:
  - Submit lists of boundaries to the NASS API and retrieve CDL rasters back.
  - Subsample and visualize retrieved data from CDL with interactive spatial images and other statistical
    plots.
  - Obtain Sentinel-2 raster files for a given area and timeframe corresponding to the retrieved CDL data
    and manipulate the sentinel-2 rasters into tables in preparation for analysis and model training.
  - Verify correct processing of data via various interactive plots (e.g. time series of pixels of various
    land covers).
