level: advanced
format: online-instructor-led
languages:
- en
start_date: '2022-02-22'
end_date: '2022-03-01'
published: '2022-02-22'
last_updated: '2026-02-17'
summary: This training builds capacity to apply Python codes and other online tools to work with datasets
  from NASA's Goddard Earth Observing System (GEOS).
description: This training, led by NASA's Applied Remote Sensing Training (ARSET) program, builds capacity
  to apply Python codes and other online tools to read, map, and analyze datasets from NASA's Goddard
  Earth Observing System (GEOS) air quality forecasts as well as products from the second Modern-Era Retrospective
  analysis for Research and Application (MERRA-2) reanalysis. The training sessions include lectures and
  hands-on activities, including exercises, interacting with web-based and offline python tools, and time
  to perform analyses.
objectives:
- Download, map, and subset GEOS outputs using tools developed by the Goddard Earth Sciences Data and
  Information Services Center (GES DISC)
- Perform intercomparison and evaluation of analysis and forecast output using Jupyter notebooks
- Perform air quality assessment using reanalysis and forecasts from GEOS, ground and satellite measurements
audience:
- This training is primarily intended for local, regional, state, federal, and international organizations
  involved in air quality management and forecasting, and those with an interest in applying remote sensing
  and global models for air quality applications.
prerequisites:
- fundamentals-remote-sensing
- introduction-access-global-air-quality-forecasting-data-tools
applications:
