summary: This ARSET training covers how data from GRACE/GRACE-FO, OPERA-DISP, and GLDAS can be used to
  assess groundwater changes.
description: 'Groundwater is a vital resource, especially in arid regions where surface water is limited.
  The U.S. Geological Survey (USGS) reports approximately 82 billion gallons of groundwater are withdrawn
  daily in the U.S. for domestic, irrigation, industrial, mining, thermoelectric, livestock, and aquaculture
  uses.


  According to the National Groundwater Association (NGWA), groundwater accounts for about 29% of total
  U.S. water usage; about two thirds of that groundwater is used for irrigation. Aquifers in certain regions
  of the world are being depleted by unsustainable groundwater pumping to support irrigated agriculture,
  including in southern High Plains and Central Valley aquifers in the U.S., northern India, the North
  China Plain, and parts of the Middle East.


  The Gravity Recovery and Climate Experiment (GRACE, 2002–2017) and GRACE Follow-On (GRACE-FO, 2018–present)
  satellite missions — supported by NASA and the German Research Centre for Geosciences (GFZ) — provide
  monthly estimates of changes in terrestrial water storage (the sum of groundwater, soil moisture, surface
  waters, snow, and ice) at spatial resolutions no better than about 150,000 km² at mid-latitudes. While
  useful for detection of large-scale changes, the coarse resolution limits regional-scale groundwater
  assessments.


  There are, however, groundwater products with higher spatial resolutions that can be useful for finer
  scale monitoring. A new product from Observational Products for End-Users from Remote Sensing Analysis
  (OPERA) provides surface displacement products (DISP) for North America that use Synthetic Aperture
  Radar (SAR) from Sentinel-1 at 30 m 2 (and from NISAR next year) to indicate subsidence due to groundwater
  withdrawal. In addition, NASA''s Global Land Data Assimilation System (GLDAS) assimilates GRACE/GRACE-FO
  data into a land surface model along with other higher resolution inputs, producing daily outputs on
  a 0.25° (~25 km) grid.


  This three-part training focuses on an overview of GRACE/GRACE-FO data, OPERA-DISP data, and GLDAS groundwater
  data for assessing seasonal to interannual groundwater changes at various spatial scales. The training
  provides hands-on experience in accessing and analyzing these products for applications.'
objectives:
- Identify characteristics of groundwater quantity datasets from GRACE/FO, OPERA, and GLDAS;
- Access, analyze, and visualize GRACE/FO data to monitor seasonal to interannual changes in large-scale
  terrestrial water storage;
- Access, analyze, and visualize GLDAS data to monitor seasonal to interannual changes in groundwater
  use at regional scales;
- Map surface subsidence related to groundwater extraction with OPERA Displacement (DISP) data;
- Utilize groundwater products from these datasets at multiple spatial/temporal scales to make decisions
  in a variety of applications, such as monitoring drought and flood conditions or planning groundwater
  resources for irrigation.
audience:
- Water resource, drought, flood, and irrigation managers from federal, state, and local government agencies,
  NGOs, and private sector organizations, both domestically and internationally.
- Academic faculty and students, mining planners, groundwater recharge and water harvesting planners.
