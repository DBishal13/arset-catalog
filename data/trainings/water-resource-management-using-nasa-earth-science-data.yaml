- en
start_date: '2015-10-13'
end_date: '2015-11-10'
published: '2015-10-13'
last_updated: '2026-03-03'
summary: This ARSET training introduces NASA data products for water resources.
description: This five-week course hosted by NASA's Applied Remote Sensing Training Program (ARSET) covers
  precipitation (rainfall and snow fraction), soil moisture, evapotranspiratoin, runoff and streamflow,
  groundwater, and lake level heights. Attendees are introduced to a number of NASA data products.
objectives:
- Access global freshwater data for applications in drought, agricultural, flooding and reservoir management
- Conduct a GIS-based analysis of regional water budgets.
