summary: This ARSET training introduces participants to the use of satellite data for conservation and
  biodiversity applications.
description: 'The United Nations Millennium Ecosystem Assessment states that "ecosystems are critical
  to human well-being – to our health, our prosperity, our security, and to our social and cultural identity."
  Conservation and biodiversity management play important roles in maintaining healthy ecosystems; Earth
  observations can help with these efforts.


  This online training series led by NASA''s Applied Remote Sensing Training program (ARSET) introduces
  participants to the use of satellite data for conservation and biodiversity applications. The series
  highlights specific projects that have successfully used satellite data. Examples include:'
objectives:
- Be able to outline uses of remote sensing for habitat suitability, species population dynamics, and
  monitoring wildfires
- Learn about the Group on Earth Observations Biodiversity Observation Network (GEOBON), Marine Biodiversity
  Observation Network (MBON), and essential biodiversity variables
audience:
- This training is designed for individuals and organizations interested in using satellite imagery for
  conservation and biodiversity.
