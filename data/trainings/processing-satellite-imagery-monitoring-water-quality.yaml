summary: This ARSET training covers how to perform advanced image processing of satellite data and use
  satellites to track indicators of harmful algal blooms.
description: 'Polluted water influences all aspects of life, including people, animals, and the environment.
  NASA satellite observations provide near real-time information about water quality, and this freely-available
  data can help decision makers in their work. Satellite data can have applications for managing drinking
  water, public health, and fisheries.


  This Applied Remote Sensing Training program (ARSET) training helps attendees perform advanced image
  processing of satellite data and learn about using satellites to track indicators of harmful algal blooms.
  This includes monitoring water temperature and chlorophyll-a concentrations. Attendees can also use
  this information for reporting around United Nations Sustainable Development Goal (SDG) 6.'
objectives:
- Access Moderate Resolution Imaging Spectroradiometer (MODIS), Landsat 7 and Landsat 8 data
- Perform image processing of MODIS and Landsat data
- Monitor water temperature and chlorophyll-a concentrations as harmful algal bloom indicators
audience:
- This training is focused at water resource managers, water intake managers, and fishery and aquaculture
  managers and farmers.
