summary: This ARSET training introduces readily-accessible tools to visualize and download water quality
  data products from diverse satellite platforms and sensors.
description: 'This training will be conducted as part of the 2026 U.S. Coral Reef Task Force (USCRTF)
  meeting on August 31, 2026. There will not be an option to attend remotely.


  This is a two-hour in-person workshop on the use of NASA Worldview and the Copernicus Browser to access
  water quality products available for U.S. coastal regions containing economically important coral reefs
  and associated ecosystems. The workshop is hosted in coordination with the USCRTF Watershed Working
  Group.'
objectives:
- Use NASA Worldview to assess water quality (i.e., chlorophyll, sea surface temperature) in tropical
  coastal regions.
- Explore the Copernicus Browser for accessing Sentinel water quality data products for an area of interest.
- Explain how different spatial and temporal resolutions affect water quality data products that can be
  obtained from Earth observations.
