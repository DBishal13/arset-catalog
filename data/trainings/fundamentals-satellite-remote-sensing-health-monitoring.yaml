summary: This ARSET training provides an overview of environmental parameters that are useful for predicting
  and monitoring environmental health events.
description: 'Predicting and monitoring disease outbreaks and environmental health events is vitally important
  to public health and safety. NASA Earth Science resources can benefit decision makers looking to apply
  remote sensing data within the health community.


  This introductory training led by NASA''s Applied Remote Sensing Training Program (ARSET) provided an
  overview of environmental parameters available from NASA Earth Science that are useful for monitoring
  and predicting health for decision support. There are many different data sources from different satellite
  missions, sensors, and models, and these training sessions outlined their features, strengths, and limitations.
  It also covered easily-accessible NASA data, web-based tools, analysis, visualization, and examples
  of data usage.'
audience:
- This course is aimed at health researchers, health policy makers, ministries of health staff, and the
  general public.
