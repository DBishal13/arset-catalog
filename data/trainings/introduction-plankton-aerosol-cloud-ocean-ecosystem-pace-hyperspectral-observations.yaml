sessions:
- part: 1
  title: Introduction to the PACE Mission for Water Quality Monitoring
  agenda:
  - Review past and current hyperspectral missions useful for water quality applications
  - Identify key features of the NASA PACE hyperspectral mission satellite and instruments useful for
    monitoring water quality of large lakes and estuaries
  - Identify advantages and limitations of using PACE/OCI data for water quality monitoring
