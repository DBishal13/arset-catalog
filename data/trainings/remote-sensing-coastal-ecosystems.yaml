summary: This ARSET training covers some of the difficulties associated with remote sensing of coastal
  ecosystems.
description: 'Coastal and marine ecosystems serve key roles for carbon storage, nutrients and materials
  cycling, and reservoirs of biodiversity. They also provide ecosystems services such as sustenance for
  millions of people, coastal protection against wave action, and recreational activities.


  Remote sensing of coastal and marine ecosystems is particularly challenging. Up to 90% of the signal
  received by the sensors in orbit comes from the atmosphere. Additionally, dissolved and suspended constituents
  in the water column attenuate most of the light received through absorption or scattering. When it comes
  to retrieving information about shallow water ecosystems, even in the clearest waters under the clearest
  skies, less than 10% of the signal originates from the water and its bottom surface.


  Users, particularly those with little remote sensing experience, stand to benefit from this Applied
  Remote Sensing Training Program (ARSET) training covering some of the difficulties associated with remote
  sensing of coastal ecosystems, particularly beaches and benthic communities such as coral reefs and
  seagrass.'
objectives:
- Identify the different water column components and how they affect the remote sensing signal of shallow-water
  ecosystems
- Outline existing satellite sensors used for ocean color and shallow-water ecosystem characterization
- Understand the interaction between water constituents, the electromagnetic spectrum, and the remote
  sensing signal
- Recognize the different processes used to remove the water column attenuation from the remotely-sensed
  signal to characterize benthic components
- Summarize techniques for characterizing shoreline beach environments with remotely-sensed data and field
  methods for beach profiling
audience:
- Local, regional, state, federal, and non-governmental environmental managers, researchers, and students.
