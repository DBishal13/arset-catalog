summary: This training provides an overview of machine learning and how to apply algorithms and techniques
  to Earth science data.
description: 'Artificial intelligence and machine learning have grown in popularity in recent decades
  as a result of advances in high-performance computing and open-source software. At its core, machine
  learning provides a statistical inference based on the inputs provided by the user, in which algorithms
  learn relationships between input data and output results. The complexity of these algorithms allows
  for the discovery of patterns and trends invisible to the human analyst, making it important to create
  analysis-appropriate input for these models to ensure that they answer the questions we are asking.


  This Applied Remote Sensing Training Program (ARSET) training provides attendees with an overview of
  machine learning in regards to Earth science and demonstrates how to apply these algorithms and techniques
  to remote sensing data in a meaningful way. Attendees are also provided with end-to-end case study examples
  for generating a simple random forest model for land cover classification from optical remote sensing.
  We present additional case studies to apply the presented workflows using additional NASA data.'
objectives:
- Recognize the most common machine learning methods used for processing Earth science data
- Describe the benefits and limitations of machine learning for Earth science analysis
- Explain how to apply basic machine learning algorithms and techniques in a meaningful manner to remote
  sensing data
- Use an analysis-appropriate training dataset to evaluate conditions and solutions for a given case study
- Complete basic procedures to interpret, refine, and evaluate the accuracy of the results of machine
  learning analysis
audience:
- Research and applied scientists interested in learning how to apply basic machine learning techniques
  to Earth science data (e.g., satellite data such as Moderate Resolution Imaging Spectroradiometer (MODIS),
  Landsat, Sentinel-2, etc.).
