summary: This ARSET training focuses on using interferometric synthetic aperture radar for characterizing
  landslides and generating a digital elevation model.
description: 'This training, led by NASA''s Applied Remote Sensing Training program (ARSET), builds on
  the skills taught in previous synthetic aperture radar (SAR) courses in terms of the use of Google Earth
  Engine for flood mapping with radar data. This training presents two new topics: the use of InSAR for
  characterizing landslides and the generation of a digital elevation model (DEM).'
objectives:
- Create a flood map using Google Earth Engine
- Generate a map characterizing areas where landslides have occurred
- Generate a DEM
audience:
- The target audience for this training are local, regional, state, federal, and international organizations
  interested in using SAR for disaster or hydrological applications.
