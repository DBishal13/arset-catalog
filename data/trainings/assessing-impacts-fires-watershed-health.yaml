sessions:
- part: 1
  title: Satellite Observations and Tools for Fire Risk
  agenda:
  - Provide examples of fire science criteria for drought conditions in a given watershed pre-fire to
    select the appropriate data from satellites/instruments for a watershed of interest
  - Demonstrate how to delineate river basins and subbasins for a watershed of interest
  - Calculate anomalies in biophysical and meteorological conditions for a watershed of interest
  - Q & A Session
