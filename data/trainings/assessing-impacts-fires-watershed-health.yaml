summary: This advanced-level training focuses on using remote sensing observations for monitoring post-fire
  impacts on watershed health.
description: 'This advanced-level training hosted by NASA''s Applied Remote Sensing Training program (ARSET)
  focuses on using remote sensing observations for monitoring post-fire impacts on watershed health, and
  builds on the ARSET training offered in 2021: Satellite Observations and Tools for Fire Risk, Detection,
  and Analysis. Specifically, this training highlights uses of NASA Earth observations (EO) for pre-fire
  land cover mapping, watershed delineation and stream mapping, post-fire burn severity mapping, and pre-
  and post-fire riverine and freshwater water quality. This training highlights case studies that use
  remote sensing data for assessing the impacts of fires on watersheds. This training also provides participants
  with hands-on exercises for using NASA EO for these assessments within the Soil Water Assessment Tool
  (SWAT) and Google Earth Engine.'
