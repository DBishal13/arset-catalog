summary: This training expands on the theory and applications of SAR data to detect and monitor floods
  using SAR time-series.
description: 'This training is a follow-on to the synthetic aperture radar (SAR) training hosted by NASA''s
  Applied Remote Sensing Training program (ARSET) in October 2022, which covered detection and monitoring
  of oil spills, landslides, and floods. This training expands on the theory and applications of SAR data
  to detect and monitor floods through the use of SAR time series in order to more closely monitor the
  increase/recession of flood waters.


  This training covers two new application areas: the use of interferometric synthetic aperture radar
  (InSAR) to measure subsidence due to groundwater extraction, and the use of SAR to detect and monitor
  sea ice. These application areas are important for environmental managers from local, regional, and
  federal governments concerned with:


  This training addresses these applications through the use of open-source tools and SAR data to inform
  on disaster awareness and response and how to best allocate resources to mitigate their impacts.'
