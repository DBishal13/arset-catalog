summary: This ARSET training introduces the applications of ECOSTRESS for crop health, volcanoes, urban
  heat, wildland fires, coastal systems, and much more.
description: 'Join us for the Applied Remote Sensing Training (ARSET) program''s first lightning-style
  training designed to support the high demand and interest from the applications community in new NASA
  Earth observing technologies that can be used to support resource management. This webinar focuses on
  a NASA instrument that was launched and installed on the International Space Station (ISS) in Summer
  2018: the ECOsystem Spaceborne Thermal Radiometer Experiment on Space Station (ECOSTRESS).


  Designed to study terrestrial ecosystems and plant water stress from the ISS, ECOSTRESS can also be
  used to better understand crop health, volcanoes, urban heat, wildland fires, coastal systems, and much
  more.


  The primary science and applications mission of ECOSTRESS is to address three critical questions around
  vegetation health and agriculture:'
objectives:
- What parameters are monitored by ECOSTRESS
- How ECOSTRESS measurements are taken, including the spatial and temporal resolution of the data
- How to access and download ECOSTRESS data via NASA's Land Processes Distributed Active Archive Center
  (LP DAAC)
- Case study examples demonstrating the use of ECOSTRESS for land management applications
audience:
- This training is designed for local, regional, state, federal, and non-governmental organizations involved
  in land management, drought monitoring, and agricultural applications.
