summary: This ARSET training provides presentations and hands-on activities about NASA remote sensing
  missions that are relevant to wildfire applications.
description: This course hosted by NASA's Applied Remote Sensing Training Program (ARSET) provided presentations
  and hands-on activities about NASA remote sensing missions that are relevant to wildfire applications.
objectives:
- Satellite remote sensing and what to expect from geospatial technologies
- Fire-related remote sensing platforms and products
- Pre-fire assessment
- Integration of geospatial technology in fire assessment
- Post-fire planning from an end-user perspective
- New tools and technologies such as the RECOVER decision support system
- Long-term fire monitoring
- Future research needs
