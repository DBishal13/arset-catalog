summary: This collaborative training between ARSET, NASA's NSIDC, and NASA's WWAO introduces NASA's snow
  and ice data products and snow water equivalence data.
description: 'Frozen water on or below the earth''s surface, known as the cryosphere, is a vital component
  of the Earth system and includes snow, glaciers, ice sheets, sea ice, and permafrost. Approximately
  75% of the Earth''s total freshwater is stored in glaciers, ice sheets, and permafrost (USGS). In many
  regions, snowmelt also serves as a major source of freshwater.


  Snow and ice play a crucial role by influencing albedo (the fraction of sunlight reflected back into
  space) which affects the Earth''s energy balance and temperature. Snow cover also significantly influences
  weather patterns, ecosystems, transportation, recreational activities, and infrastructure (Why Snow
  Matters - NSIDC). Mountain snowpack can lead to avalanches, and the timing and volume of melt can trigger
  flooding in snow-fed rivers. Conversely, reduced snowpack can result in snow droughts, impacting water
  availability.


  NASA provides regional and global snow and ice data products based on remote sensing observations. Additionally,
  NASA Earth system models can diagnose snowfall during winter and estimate snow water equivalent—a key
  parameter for assessing freshwater resources. This collaborative training between ARSET, NASA''s National
  Snow and Ice Data Center (NSIDC), and NASA''s Western Water Actions Office (WWAO), introduces NASA''s
  snow and ice data products and snow water equivalence data, with a particular focus on snow data application
  to monitoring and forecasting snow-fed river flow and water availability.'
audience:
- Regional, state, and federal water resources managers, river network and disasters managers, fish and
  wildlife managers.
- Academic students and faculty.
