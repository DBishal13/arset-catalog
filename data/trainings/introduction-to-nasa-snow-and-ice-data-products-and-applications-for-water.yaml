sessions:
- part: 1
  title: Overview of NASA Snow and Ice Data Products
  agenda:
  - Recognize the impacts of snow and ice parameters to water resources applications.
  - Identify NASA snow and ice data products and their applications for water resource management and
    disaster monitoring.
  - Identify snow and ice data parameters and their characteristics.
  - Explore examples of applications of snow and ice data for water resource management.
