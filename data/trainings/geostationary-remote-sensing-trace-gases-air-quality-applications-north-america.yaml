summary: This training will provide an overview of TEMPO capabilities and available trace gas data products,
  and illustrate how TEMPO data can be visualized.
description: 'The Tropospheric Emissions: Monitoring of POllution (TEMPO) mission is the first space-based
  instrument to continuously measure daytime air quality over North America, from the Atlantic Ocean to
  the Pacific and from Central Canada to Mexico City. These data are essential for understanding diurnal
  changes in air quality and monitoring real-time movement of pollutant plumes, such as wildfire smoke
  and urban emissions. This training, led by NASA''s Applied Remote Sensing Training Program (ARSET),
  will provide an overview of TEMPO capabilities and available trace gas data products, and illustrate
  how TEMPO data can be visualized using NASA Worldview online. These capabilities will be demonstrated
  through hands-on exercises where participants will look at TEMPO data events and learn how to interpret
  TEMPO observations to better understand the scope and potential air quality impact of these types of
  hazards.'
objectives:
- Describe the basic characteristics of TEMPO and its benefits and limitations compared to other air-quality-relevant
  missions and instruments
- Identify available trace gas data products from TEMPO and their associated characteristics
- Visualize hourly TEMPO trace gas data products using NASA Worldview for current and historical events
- Evaluate TEMPO trace gas products in Worldview to anticipate short-term air quality risks, such as high
  concentrations of ozone precursors
- Distinguish uses for TEMPO trace gas data products given cloud and solar zenith angle thresholds
- Determine the spatial patterns, temporal trends, and likely sources of trace gases related to wildfire
  smoke and urban area air pollution events using TEMPO data via Worldview
