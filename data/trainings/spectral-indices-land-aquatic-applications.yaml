summary: This training provides an overview of spectral indices for land and aquatic applications.
description: 'This training, offered by NASA''s Applied Remote Sensing Training Program (ARSET), provides
  an overview of spectral indices for land and aquatic applications. Specifically, this training begins
  with an introduction to the Normalized Difference Vegetation Index (NDVI), along with its calculation,
  uses, and prominence in Earth science.


  In session two, we expand to other spectral indices primarily used in aquatic ecosystems, such as the
  Normalized Difference Chlorophyll Index (NDCI), Normalized Difference Aquatic Vegetation Index (NDAVI),
  Floating Algal Index (FAI), and Normalized Difference Turbidity Index (NDTI) for aquatic applications.
  In the final session we review additional land-based indices such as the Enhanced Vegetation Index (EVI),
  Soil-Adjusted Vegetation Index (SAVI), and Normalized Burn Ratio (NBR).


  These sessions discuss the correct circumstances under which to use these indices, and participants
  take part in hands-on indices calculation over relevant study areas. Learners work with data from Landsat
  9 Operational Land Imager 2 (OLI-2), Sentinel-2 Multispectral Imager (MSI), and Harmonized Landsat Sentinel-2
  (HLS) for indices calculation.


  The training discusses pre-calculated index products such as Terra Moderate Resolution Imaging Spectroradiometer
  (MODIS) vegetation indices and HLS vegetation indices suite and upcoming data products available based
  on user feedback provided to the Satellite Needs Working Group. Use cases from recent Earth Action projects
  (such as NASA DEVELOP) further highlight how spectral indices can provide essential information about
  land and aquatic environments.'
