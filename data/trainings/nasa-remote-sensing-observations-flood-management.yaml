end_date: '2015-06-28'
published: '2015-06-08'
last_updated: '2026-03-02'
summary: This ARSET training introduces remote sensing resources available for monitoring extreme precipitation
  and flooding as well as flood mapping tools.
description: This training hosted by NASA's Applied Remote Sensing Training program (ARSET) introduces
  remote sensing resources available for monitoring extreme precipitation and flooding as well as flood
  mapping tools for flood management and planning.
audience:
- This training is for individuals in local, regional, state, federal, and international organizations,
  non-governmental organizations, and other applied professionals interested in flood management.
