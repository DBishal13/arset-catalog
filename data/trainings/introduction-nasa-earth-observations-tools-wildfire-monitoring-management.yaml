summary: This ARSET training familiarizes participants with the various modules available in FIRMS and
  explores the range of data and information available.
description: 'Wildland fire managers, scientists, and the public benefit from timely and easy-to-access
  information about current fire activity to assess potential risks and to support fire suppression activities.
  NASA provides multiple sources of time-sensitive satellite imagery and derived data products within
  the Fire Information for Resource Management System (FIRMS).


  FIRMS is a web-based application with a dynamic mapping interface to visualize current and historical
  satellite imagery, active fire detections/hot spots, and related science data products to identify the
  location, extent, and intensity of wildland fire activity and to chronicle its effects. The application
  also provides multiple tools for users to access and ingest data as downloadable GIS datasets and map
  services for use in applications.


  This three-part ARSET training will familiarize participants with the various modules available in FIRMS,
  explore the range of data and information available as well as the characteristics of satellite-based
  active fire detection, and provide hands-on experience that participants can apply to query, access,
  and visualize the data in GIS and other applications.'
