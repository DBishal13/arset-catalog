summary: This ARSET training guides participants through mapping extent and quantifying carbon stocks
  of blue carbon ecosystems.
description: 'Nature-based climate solutions are an increasingly critical component of mitigating greenhouse
  gas emissions to meet the Paris Agreement goal of keeping temperature change to less than 2 degrees
  celsius. Blue carbon ecosystems, such as mangroves, salt marshes, and sea grasses, are a key aspect
  of nature-based climate solutions because of high carbon sequestration rates, long-term burial of carbon
  in sediments, potential for restoration, and connections to many additional ecosystem services.


  This training hosted by NASA''s Applied Remote Sensing Training program (ARSET) builds from a series
  of previous trainings on Remote Sensing of Coastal Ecosystems, Remote Sensing of Mangroves, Remote Sensing
  of Greenhouse Gases, and Remote Sensing of Carbon Monitoring for Terrestrial Ecosystems to provide a
  comprehensive overview of blue carbon ecosystem remote sensing. The course guides participants through
  mapping extent and quantifying the carbon stocks of blue carbon ecosystems using Earth observations
  to support assessment, monitoring, and restoration goals of these ecosystems.'
