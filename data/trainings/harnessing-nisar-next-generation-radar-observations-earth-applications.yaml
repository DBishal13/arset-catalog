summary: This ARSET training introduces users to the characteristics and data of the NISAR mission and
  demonstrates workflows for accessing, visualizing, and analyzing the data for a range of applications.
description: 'Synthetic aperture radar (SAR) data is becoming increasingly accessible through open datasets,
  including those from the newly launched NISAR mission. One of SAR’s main advantages is its ability to
  observe Earth''s surface by day or night and under most weather conditions, making it especially valuable
  in persistently cloudy regions like the tropics or in high-latitude areas with long periods of darkness.


  NISAR provides a wealth of data for both scientific research and practical applications, but it can
  be challenging for users to interpret and apply. This course is designed to help users understand the
  unique characteristics of NISAR data and learn how to access, visualize, and analyze them for various
  scientific and applied purposes.


  This training consists of three sessions:'
objectives:
- Identify the characteristics, capabilities, and limitations of NISAR data.
- Recognize how NISAR data can be applied to decision-making related to flooding, agriculture, earthquakes,
  and landslides.
- Differentiate between the various NISAR data products and their applicability for different real-world
  use cases.
- Demonstrate how to access NISAR data and tools via the ASF DAAC platform to search, visualize, and analyze
  data for case studies related to floods, earthquakes, landslides, and agriculture.
- Generate a flood map, landslide risk map, and volcano deformation map for events of interest using interferogram
  (GUNW) files in QGIS.
- Demonstrate how to access NISAR data via the ISRO Bhoonidhi platform, and use available tools for basic
  visualization and analysis.
