id: integrating-remote-sensing-water-quality-monitoring-program
title: Integrating Remote Sensing into a Water Quality Monitoring Program
status: draft
source_url: https://www.earthdata.nasa.gov/learn/trainings/integrating-remote-sensing-water-quality-monitoring-program
level: advanced
format: online-instructor-led
languages:
- en
start_date: '2019-06-05'
end_date: '2019-06-19'
published: '2019-06-05'
last_updated: '2026-02-09'
summary: This ARSET training focuses on integrating NASA Earth observations into water quality monitoring
  decision-making processes.
description: This training hosted by NASA's Applied Remote Sensing Training program (ARSET) focuses on
  integrating NASA Earth observations into water quality monitoring decision-making processes. This includes
  overviews of data products used for water quality monitoring; aquatic remote sensing-specific criteria,
  methods, and best practices; obtaining NASA Earth observation data for water quality monitoring; and
  practical skill-building in image processing for water quality monitoring of coastal and larger inland
  water bodies. Three two-hour parts include lectures, hands-on demonstrations, written instructions to
  conduct exercises, and a question and answer session.
objectives:
- Acquire relevant remotely-sensed imagery and products
- Apply best practices for atmospheric correction to remotely-sensed images
- Evaluate the uncertainty of images by validating satellite imagery using in situ measurements
- Analyze water quality data using NASA's SeaDAS software and validate aquatic remote sensing data products
audience:
- This training is intended for regional, state, federal, and international organizations interested in
  addressing water quality monitoring through the use of remote sensing.
prerequisites:
- fundamentals-remote-sensing
- processing-satellite-imagery-monitoring-water-quality
applications:
- water-resources
