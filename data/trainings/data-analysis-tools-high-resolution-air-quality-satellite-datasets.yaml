start_date: '2018-01-17'
end_date: '2018-01-22'
published: '2018-01-17'
last_updated: '2026-02-06'
summary: This ARSET training teaches how to use Python scripts to map and analyze air quality data through
  hands-on exercises.
description: High-resolution air quality data is helpful for monitoring urban air pollution. In this training
  led by NASA's Applied Remote Sensing Training program (ARSET), participants learned how to use Python
  scripts to map and analyze air quality data through hands-on exercises. The training covered Moderate
  Resolution Imaging Spectroradiometer (MODIS) aerosol optical depth data and Ozone Monitoring Instrument
  (OMI) NO2 and SO2 data.
objectives:
- Use available Python scripts to read, map, and analyze Level 2 data
- Modify available scripts for future use
audience:
- This training is primarily intended for air quality professionals and decision makers from local, state,
  and federal agencies, non-governmental organizations (NGOs), and the private sector. Governmental and
  NGOs engaged in air quality monitoring will be given preference over organizations focused primarily
  on research.
