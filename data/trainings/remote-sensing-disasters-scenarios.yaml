summary: This ARSET training shows how NASA remote sensing data can be used to characterize and monitor
  disaster-related events and support relief efforts.
description: According to the World Health Organization, disasters “kill around 90,000 people and affect
  close to 160 million people worldwide” every year. This training, led by NASA's Applied Remote Sensing
  Training program (ARSET), shows participants how remote sensing data can be used to characterize and
  monitor disaster-related events and support relief efforts. Each session covers a different disaster
  and its supporting data. Disaster scenarios include tropical storms, flooding, earthquakes, and landslides.
objectives:
- Identify NASA data products to characterize and monitor disasters and support decision-making
- Understand the different data products available and their shortcomings
- Access and interpret data covered in the different sessions
audience:
- This training is for disaster management agencies, including domestic and international government agencies
  (e.g. the Federal Emergency Management Agency (FEMA) and equivalent government organizations outside
  the U.S.) as well as aid organizations (e.g. Red Cross, United Nations).
