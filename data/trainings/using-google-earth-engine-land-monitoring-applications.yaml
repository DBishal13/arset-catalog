summary: This ARSET training covers the Google Earth Engine Code Editor and hands-on exercises for processes
  integral to optical imagery analysis.
description: 'Google Earth Engine (GEE) for remote sensing applications is quickly becoming one of the
  most utilized tools in the scientific and decision-making community. GEE provides unparalleled access
  to large-scale data analysis through cloud computing technology. The online interface allows users to
  access and analyze stores of NASA Earth data without the need for any locally stored data or software.


  This training, led by NASA''s Applied Remote Sensing Training (ARSET) program, covers the GEE Code Editor,
  hands-on exercises on change detection, time series analysis, land cover classification, and accuracy
  assessment of optical imagery. These processes are an integral part of optical imagery analysis for
  many applications, including monitoring forest disturbance, wildfire mapping, identifying land cover
  degradation, mapping ecosystem connectivity, and identification of land surface changes due to urban
  growth.'
objectives:
- Navigate the GEE interface to explore remote sensing datasets relevant to land monitoring
- Execute JavaScript commands to retrieve satellite data and process imagery for analysis
- Complete a supervised land classification along with an accuracy assessment in GEE
- Apply algorithms to derive a time series of environmental parameters and calculate differences between
  years to detect landscape changes
- Illustrate the capabilities of cloud-based raster computing for land management applications.
audience:
- This training is designed for local, regional, state, federal, and non-governmental organizations involved
  in land management, conservation, biodiversity, and forest monitoring.
