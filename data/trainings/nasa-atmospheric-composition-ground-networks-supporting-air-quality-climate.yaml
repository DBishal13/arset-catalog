summary: This ARSET training provides an overview of aerosol and trace gas measurements using active and
  passive techniques for ground based remote sensing.
description: 'In this five-part, online, intermediate-level training, multiple NASA networks provide training
  on their atmospheric composition ground networks. These networks provide data relevant to aerosol and
  trace gas column concentrations and vertical structure, supporting applications in air quality and climate.
  Surface networks from NASA and other international contributions form the backbone of long-term atmospheric
  composition observations globally and provide continuity and validation across typically shorter satellite
  mission lifetimes.


  This online training provides a basic understanding of aerosol and trace gas measurements using both
  active and passive techniques for ground based remote sensing. It also teaches users how to select,
  access, and incorporate relevant data from these ground networks into their work. Finally, it demonstrates
  an application comparing ground-based and satellite remote sensing products. The training includes lectures,
  hands-on exercises, and a homework assignment.


  [Optional]: To follow along with the demonstrations for this training, please review optional prerequisites
  listed under each training part below. Please also register for an Earthdata account.'
objectives:
- Identify the basic characteristics, capabilities, and limitations of the NASA instruments used for ground-based
  active and passive remote sensing of aerosols, ozone, and NO2.
- Recognize how the ground networks presented in the training sustain global long-term observations, support
  air quality and climate applications, and complement satellite observations.
- Access relevant atmospheric composition data from appropriate NASA ground networks for given locations
  and application purposes.
- Compare and jointly analyze specific ground-based atmospheric composition data products with relevant
  satellite remote sensing data (e.g., satellite aerosol data products) for a given location and time.
