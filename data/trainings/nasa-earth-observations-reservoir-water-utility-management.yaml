summary: This ARSET training uses precipitation, soil moisture, and snow data to help reservoir managers
  assess inflows and manage water allocation and flood risks.
description: 'Managing reservoirs is a complex task, requiring a careful balance between water storage,
  flood control, electricity generation, and drinking water supplies. Factors such as seasonal snow cover,
  total snow water equivalent (SWE), antecedent soil moisture, and extreme precipitation events significantly
  influence the volume and timing of reservoir inflows. For effective hydropower planning and flood mitigation,
  monitoring the volume of precipitation—including rainfall, snow cover, and spring snowmelt at high latitudes
  and altitudes—and understanding the soil moisture and saturation of a basin prior to a storm are critical
  for predicting runoff and monitoring water levels in reservoirs and inflow rivers.


  NASA Earth observations and modeled data provide vital insights into these precursor conditions. Satellite-derived
  soil moisture and precipitation data allow managers to monitor basin saturation and heavy rainfall events.
  Additionally, remote sensing of snow cover and SWE fills critical data gaps in low-elevation and un-gauged
  mountainous areas, offering a comprehensive view of available water before it melts. Moreover, data
  on rain and snow melt runoff, water level heights of reservoirs and inflow rivers, and streamflow provide
  needed information for monitoring reservoir systems and watershed conditions to make informed management
  decisions.


  This three-part training focuses on case studies and hands-on exercises using rain and snow, soil moisture,
  runoff and streamflow, and water level height, to help users monitor reservoir inflows, optimize water
  release decisions, and manage flood risks.'
objectives:
- Recognize the importance and availability of Earth observations (EO) and modeled data for reservoir
  management.
- Identify NASA EO products applicable to reservoir management, focusing on key hydrological parameters
  such as precipitation, soil moisture, snow cover, snow water equivalent (SWE), runoff, water surface
  elevations for reservoirs and tributaries, and simulated streamflow in inflow rivers from a global hydrology
  model.
- Access and visualize the EO parameters using relevant web tools and Google Earth Engine to monitor critical
  watershed conditions upstream of reservoir inflows and water levels in reservoirs.
- Apply the GEOGLOWS hydrology model to query historical river data and construct predictive streamflow
  hydrographs for inflow rivers.
- Analyze time series of the EO parameters for given river basin boundaries and reservoirs of interest.
