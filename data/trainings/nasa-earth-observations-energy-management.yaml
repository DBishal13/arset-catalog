summary: This ARSET training introduces how NASA earth observations can contribute to a greater understanding
  of energy management applications.
description: 'Energy impacts everything we do, from providing basic services such as cooking and cleaning
  to providing development opportunities and improving overall quality of life. However, energy management,
  through energy production, transmission, and distribution, is impacted by environmental and climate
  conditions, including weather patterns or extremes and climate change.


  Energy providers are turning to cleaner and renewable energy sources, as well as assessing and implementing
  actions to make their energy management activities more resilient to environmental hazards. Decision
  makers need to better understand where energy resources exist and how they are impacted by physical
  environmental conditions, weather, and climate.


  This training offers participants an introduction to how NASA Earth observations (EOs) can contribute
  to a greater understanding of energy management applications. The course summarizes priorities and challenges
  for energy management and how various NASA EOs can support decision making.


  Attendees gain familiarity with a broad set of relevant NASA datasets, tools, platforms, and resources,
  as well as hear about case studies and real-world applications related to climate resilience, energy
  efficiency, and renewable energy.'
objectives:
- Be able to summarize priorities and challenges in the energy management sector and how Earth observations
  can support decision making
- Become familiar with online tools for acquiring data from satellite missions and visualizing data or
  conducting analyses
- Be aware of various use cases for Earth Observations in energy management for renewable energy, energy
  efficiency, and climate resilience
audience:
- The audience is primarily energy management professionals and decision makers from local government,
  state agencies, the private sector, or other stakeholders (e.g., electric utilities).
