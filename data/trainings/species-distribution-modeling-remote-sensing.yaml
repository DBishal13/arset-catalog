summary: This ARSET training provides an overview of species distribution models and how to use remote
  sensing data for landscape characterization.
description: 'Species distribution models (SDMs) play a critical role in biodiversity, conservation, and
  understanding the potential impacts to ecosystems under changing climate conditions. SDMs contextualize
  future scenarios based on known or projected ecological parameters and are the cornerstone for adaptive
  management planning around short- and long-term changes to complex landscapes.


  This training, led by NASA''s Applied Remote Sensing Training (ARSET) program, provides an overview
  of SDMs, shows how to use remote sensing data for landscape characterization, and highlights multiple
  Applied Sciences projects that have developed tools for conducting SDMs for a variety of ecosystems.
  This includes a special session on the Wallace R-based platform for modeling of species niches and distributions.


  Participants are provided with demonstrations and additional resources for using these tools for their
  own species modeling applications.'
objectives:
- Outline the uses of SDMs
- Recall the data inputs and model framework of SDMs
- Distinguish the benefits and limitations of SDMs
- Execute the R-based Wallace code for SDMs
- Summarize and access multiple SDM tools.
audience:
- This training is for local, regional, state, federal, and non-governmental organizations involved in
  conservation, biodiversity, species modeling, and coastal and ocean processes.
