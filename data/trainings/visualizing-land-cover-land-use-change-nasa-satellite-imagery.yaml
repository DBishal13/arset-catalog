summary: This ARSET training explores how the R statistical coding language can be used to classify land
  cover and quantify changes in land cover over time.
description: 'Land cover and land use change (LCLUC) describes the many ways our world changes around
  us. Every new building, each vacant lot, and the expansion and retreat of forests or wetlands are all
  examples of LCLUC. These changes may be slow or sudden, but understanding the ways in which our landscape
  is changing gives us the opportunity to better anticipate and avoid problems that may arise.


  This training, led by NASA''s Applied Remote Sensing Training program (ARSET), covers some of the ways
  that we can use NASA data to determine what is happening on the ground and how that changes over time.
  Participants will see examples of supervised and unsupervised classification models implemented in the
  R statistical coding language, and improve their understanding of how these models can be used to produce
  maps and metrics of LCLUC.'
objectives:
- Access NASA Earth observation data (e.g., Harmonized Landsat and Sentinel-2 (HLS)) relevant to LCLUC
  mapping.
- Convert NASA Earth observation data into distinct land cover and land use (LCLU) classes using supervised
  and unsupervised machine learning classification methods in the R programming language.
- Recognize the role of classification methods as one part of a change monitoring strategy.
- Compute a change matrix representing the change in LCLU between two dates.
- Create a map in RStudio visualizing the differences in LCLU between two dates.
audience:
- Professionals interested in coding to quantify land cover change as it relates to phenomena such as
  forest composition change, deforestation, urban expansion, habitat loss, and hydro/cryosphere changes.
- Other scientists or analysts interested in leveraging automated tools for decision support around land
  use management, natural resource management, or other issues that have an impact on how our world is
  structured across space and time.
