summary: This training will cover how soil moisture is modeled within LIS in to improve drought monitoring.
description: 'This training hosted by NASA''s Applied Remote Sensing Training Program (ARSET) focuses
  on introducing the NASA Land Information System (LIS) output of soil moisture at various depths for
  drought analysis and monitoring. Traditional drought applications and indices focus on sensible weather
  (temperature, wind, etc.) and precipitation trends and their impacts on the hydrologic system.


  As a result of the NASA Short-term Prediction Research and Transition Center (SPoRT) program and its
  research-to-operations (R2O) work, this training demonstrates how LIS output of soil moisture from a
  land surface model (LSM) can be included in traditional drought monitoring applications. The NASA SPoRT
  Program has implemented a version of NASA LIS (SPoRT-LIS) that utilizes near real-time Green Vegetation
  Fraction (GVF) from Suomi NPP Visible Infrared Imaging Radiometer Suite (VIIRS) retrievals, as opposed
  to static, climatology values of GVF.


  Near real-time forcing of the LSM by the Multi-Radar Multi-Sensor (MRMS) precipitation and the Global
  Data Assimilation System (GDAS) sensible weather data provide near real-time, observation-driven products
  with ~2–8 hours latency. Each of these enable a more accurate depiction of vegetation and soil moisture
  impacts related to both long-term and short-term drought events, including rapid-onset flash drought
  events.


  Research-to-Operations work at SPoRT has led to the development of value-added products such as the
  derived percentile products for soil moisture. For example, low percentile values from SPoRT-LIS have
  been shown to correspond well to areas experiencing short-term drought within the U.S. Drought Monitor
  (USDM). Via Operations-to-Research (O2R) activities with end-users, soil moisture changes on various
  timescales pertinent to drought applications have been added to the SPoRT-LIS output data suite.


  This training improves the user’s understanding of how soil moisture is modeled within LIS to improve
  the interpretation and application of this output for drought monitoring. Conducted by experts in LIS
  and operational drought monitoring, the overall course enables users to interpret SPoRT-LIS soil moisture
  percentile products for drought applications.


  Examples from operational applications as well as practice exercises (for using LIS data for drought
  monitoring) are included in this course. Access to the SPoRT-LIS products via online viewer, in GIS
  formats, and GIS-based display tools, are also included. Moreover, self-paced microlessons are available
  to help users confirm their understanding and improve their skill via homework lessons between live
  sessions.'
objectives:
- Apply LIS output to efficiently analyze drought over large spatial areas in conjunction with current
  practices and to integrate this capability with existing data.
- Identify the NASA/LIS basics regarding the framework, input forcing, static fields, LSM structure, and
  output most relevant to drought.
- Summarize the derived soil moisture percentile products and how these are created.
- Apply SPoRT-LIS output and/or derived products to both complement existing data and overcome limitations
  to monitoring drought over large areas.
- Recognize ‘best practices’ for LIS impact related to drought.
- Configure LIS output file for viewing within a Geographic Information Systems (GIS)-based display tool
  and for tailored output products and graphics.
