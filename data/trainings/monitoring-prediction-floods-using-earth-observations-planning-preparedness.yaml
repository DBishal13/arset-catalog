summary: This three-part ARSET training covers flood monitoring via remote sensing, NASA flood products,
  and GEOGLOWS streamflow predictions.
description: 'Floods are the most common and widespread of all weather-related natural disasters. Lasting
  from minutes to weeks, floods can place a huge burden on a community, including loss of life, damage
  to infrastructure and economies, and long-term impacts on human health and well-being. Remote sensing
  observations and Earth system models, when combined with hydrologic models, can support both flood monitoring
  and prediction efforts to significantly improve preparedness and response planning.


  This three-part training included an overview and demonstration of flood monitoring tools based on remotely
  sensed optical observations, NASA''s near real-time Global Flood Product, and several Observational
  Products for End-users from Remote Sensing Analysis (OPERA). Additionally, the training introduced a
  streamflow prediction tool — the Group on Earth Observations Global Water Sustainability (GEOGLOWS)
  model — which provides global, historical, and 15-day streamflow predictions. Trainers guided participants
  through hands-on exercises to access and visualize selected flood data.'
objectives:
- Identify datasets in NASA's Global Flood Product, which is based on remotely sensed optical observations.
- Use the webtool, NASA Worldview, to access and visualize flooded regions from Global Flood Product,
  available from multiple satellites, from 2021 to near-real time.
- Identify OPERA dynamic surface water extent data for flood detection derived from optical and SAR observations.
- Access and visualize OPERA dynamic surface water extent data for flood events using NASA Worldview.
- Identify the capabilities of GEOGLOWS River Forecast System (RFS) for global streamflow prediction.
- Use GEOGLOWS Hydroviewer to access globally available retrospective and predicted streamflow for selected
  rivers.
audience:
- Local, regional, federal, and non-governmental organizations, as well as companies, involved in flood
  and water resources management, emergency response, disaster relief and rescue operations, flood insurance,
  and real estate and infrastructure building.
- Students and academics who are interested in learning about remote sensing of flood monitoring and predictions.
