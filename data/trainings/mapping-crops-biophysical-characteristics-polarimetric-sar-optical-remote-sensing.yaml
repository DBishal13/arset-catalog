summary: This ARSET training presents more advanced radar remote sensing techniques using polarimetry
  to extract crop structural information.
description: 'Mapping crop types and assessing their characteristics is critical for monitoring food production,
  enabling optimal use of the landscape, and contributing to agricultural policy. Remote sensing methods
  based on optical and/or microwave sensors have become an important means of extracting information related
  to crops. Optical data is related to the chemical properties of the vegetation, while radar data is
  related to vegetation structure and moisture. Radar can also image the Earth’s surface regardless of
  almost any type of weather condition.


  This four-part, advanced training hosted by NASA''s Applied Remote Sensing Training Program (ARSET)
  builds on a previous ARSET training. Here we present more advanced radar remote sensing techniques using
  polarimetry to extract crop structural information.


  We also present Sen4Stat — an open source system demonstrating the potential of optical and synthetic
  aperture radar (SAR) satellite Earth observations for monitoring and reporting of the UN Sustainable
  Development Goal (SDG) targets related to agriculture. Sen4Stat also combines Earth observation data
  with national statistical data sets and surveys to support National Statistical Offices in the uptake
  of satellite Earth observations for agricultural statistics.


  This series focuses on the use of dual polarization Sentinel-1 C-SAR, fully polarimetric C-band SAR
  from the RADARSAT Constellation Mission (RCM), fully polarimetric L-band SAR from SAOCOM (SAtélite Argentino
  de Observación COn Microondas), and optical imagery from Sentinel-2 to map and monitor crop types and
  assess their biophysical characteristics.


  This series also covers the theory of SAR polarimetry and include a practical exercise using the Sentinel
  Application Platform (SNAP) and Python code written in Jupyter Notebooks, a web-based interactive development
  environment for scientific computing and machine learning.


  This webinar series is a collaboration between ARSET, Agriculture and Agri-Food Canada (AAFC), European
  Space Agency (ESA), United Nations Office for Outer Space Affairs (UNOOSA), University of Stirling,
  Université Catholique de Louvain (UCLouvain), and the CEOS Working Group on Capacity Building and Data
  Democracy (WGCapD).'
objectives:
- Explain the theory behind SAR polarimetry, especially as related to crop characteristics
- Generate polarimetric parameters using open source imagery/software and perform a time series analysis
  of crop growth
- Identify how Sen4Stat can support National Statistical Offices in the uptake of satellite Earth observations
  for agricultural statistics
- Perform a time series analysis of crop types using Sentinel-2 derived LAI index
audience:
- This webinar series is intended for local, regional, federal, and non-governmental organizations from
  agriculture and food security related agencies to use radar and optical remote sensing applications
  in the domain of agriculture for crop mapping and monitoring.
