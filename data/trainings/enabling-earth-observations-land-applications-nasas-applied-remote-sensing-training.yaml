summary: This ARSET training provides an overview of NASA Earth Observation data and available tools for
  land, climate, and wildfire applications.
description: NASA's Applied Remote Sensing Training Program (ARSET) exists to introduce and build skills
  of individuals and institutions in the use and application of remote sensing information and datasets.
  ARSET offers online and in-person training to develop technical skills and empower users to utilize
  NASA Earth Science resources in the decision making process. Since 2008 the program has reached over
  100,000 participants. In this training, members of our ARSET Ecological Conservation team provided an
  overview of NASA Earth Observation data and some available tools for land, climate, and wildfire applications.
objectives:
- Explore ways that satellite remote sensing observations are used to study Earth's systems.
- Identify remote sensing data and products that can be used for fire mapping and monitoring.
- Access the Fire Information for Resource Management System (FIRMS) for monitoring active fires and gathering
  information about historical fires.
- Access and download EO products from NASA EarthData for analysis in FIRMS.
