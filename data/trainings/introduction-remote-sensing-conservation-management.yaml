summary: This ARSET training focuses on regional and global observation resources for conservation management.
description: This training series focuses on regional and global observation resources for conservation
  management. It provides a basic overview of remote sensing, tools for accessing and visualizing relevant
  NASA Earth science data, and case study applications for utilizing these tools for conservation management.
objectives:
- Provide an overview of remote sensing, details on how to access and visualize relevant NASA Earth science
  data, and how to use these data for conservation and biodiversity issues.
- Assist non-governmental agencies (NGOs) and land management professionals in decision-making through
  the use of NASA data, relevant tools, and assessment methods.
audience:
- The target audience for this series are NGOs (national and international) focused on conservation and
  biodiversity issues.
