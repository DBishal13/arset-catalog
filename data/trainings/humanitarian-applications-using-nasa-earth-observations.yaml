summary: This ARSET training focuses on using NASA data products for monitoring human settlements and
  landscapes during armed conflict and forced displacement.
description: 'Conflict, war, and forced displacement affect millions of people each year and have immediate
  and long-term consequences for human health and development, in addition to causing the degradation
  of natural and managed landscapes. Analysis with NASA satellite imagery can help target humanitarian
  response and relief by offering a timely understanding of region-specific environmental conditions and
  change, and capturing contextual information over broad geographic regions and time spans.


  This Applied Remote Sensing Training program (ARSET) training focuses on using NASA data products for
  monitoring human settlements and landscapes during armed conflict and forced displacement. It is the
  first training dedicated to humanitarian applications of NASA satellite imagery with topics including
  monitoring urban damage, mapping refugee settlement dynamics, and gauging climate hazards at refugee
  settlements. For each topic, we discuss relevant satellite sensors and methodologies, data access and
  analysis using Google Earth Engine, as well as assumptions, opportunities, and limitations of various
  remote sensing-based approaches in humanitarian applications.


  This training supports quantitative and visual understanding of short- and long-term conflict effects
  that are evident in satellite imagery, complements analysis of georeferenced humanitarian data, and
  builds on previous ARSET trainings associated with cropland monitoring, human settlement detection,
  disaster risk assessment, nighttime lights, and Google Earth Engine.'
objectives:
- Conceptualize landscape- and settlement-level monitoring with satellite remote sensing
- Select a range of satellite image data (i.e., optical, radar, nighttime lights, etc.) for humanitarian
  applications
- Recognize the value of time series analysis for monitoring acute and long-term changes in humanitarian
  contexts
- Identify opportunities and limitations of using satellite data in humanitarian applications
- Integrate satellite-derived humanitarian data with other open-access geospatial products on population,
  building footprints, infrastructure, etc.
audience:
- This training is primarily intended for stakeholders, academics, researchers, non-governmental organizations
  (NGOs), international agencies, and government ministries involved in humanitarian response and decision
  support activities.
