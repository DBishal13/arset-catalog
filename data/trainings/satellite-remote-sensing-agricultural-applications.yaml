summary: This ARSET training addresses how to use remote sensing data for agriculture monitoring, specifically
  drought and crop monitoring.
description: 'Since the launch of NASA’s first Landsat mission in 1972, satellite imagery has been used
  for global agricultural monitoring, providing one of the longest operational applications for the Landsat
  program. Although satellite observations of land began with agricultural monitoring, only in recent
  years has agricultural remote sensing seen reinvigoration among space agencies, national ministries
  of agriculture, and global initiatives.


  To monitor agricultural systems, NASA utilizes satellite observations to assess a wide variety of geophysical
  and biophysical parameters, including precipitation, temperature, evapotranspiration, soil moisture,
  and vegetation health.


  Past webinars on land and water resources by NASA''s Applied Remote Sensing Training program (ARSET)
  cover remote sensing-derived parameters relevant to agriculture within a broader scope. This four-part,
  introductory ARSET webinar focuses on data products, data access, and case-studies demonstrating how
  remote sensing data can be used for decision-making among the agriculture and food security communities.


  This training addresses how to use remote sensing data for agriculture monitoring, specifically drought
  and crop monitoring. It also provides end-users the ability to evaluate which regions of the world have
  agricultural productivity above or below long-term trends. This informs decisions pertaining to market
  stability and humanitarian relief.'
objectives:
- Identify which satellites and sensors can be used for agricultural applications
- Understand the limitations of remote sensing and modeled data for agriculture and food security
- Acquire specific remote sensing data products that are appropriate for their work
- Apply remote sensing techniques to crop monitoring, drought, and humanitarian relief.
audience:
- This training is designed for local, state, federal, private, and non-governmental organizations involved
  in agricultural monitoring, agricultural policy, food security, agricultural insurance, and humanitarian
  relief.
