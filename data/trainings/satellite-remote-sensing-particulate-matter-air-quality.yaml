summary: This ARSET training covers specific details on datasets, available tools, and various methods
  used to address particulate matter air quality.
description: 'Satellite remote sensing of particulate matter for air quality applications has advanced
  over the past decade. Many methods, data, and tools have been developed by various groups around the
  world to convert satellite retrieved aerosol properties into surface level particulate matter mass concentrations
  for air quality monitoring. Data from several satellites are currently being used for a wide range of
  air quality applications for both research and operational purposes.


  Through a combination of presentations from experts in the field and hands on exercises, this advanced
  webinar series will cover specific details on datasets, available tools, and various methods used to
  address particulate matter air quality.'
objectives:
- Estimate PM2.5 mass concentration at surface level while using satellite derived aerosol optical depth
  (AOD) at visible wavelength
- Perform long term air quality trend analysis
- Analyze air quality events
audience:
- Individuals in local, regional, state, federal, and international organizations, NGOs, and other applied
  professionals interested in air quality.
