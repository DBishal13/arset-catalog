summary: This ARSET training is tailored to those interested in learning how to access and visualize NASA
  satellite imagery.
description: 'This training hosted by NASA''s Applied Remote Sensing Training program (ARSET) is tailored
  to those interested in learning how to access and visualize NASA satellite imagery. With the world’s
  eyes and media coverage turned to recent global changes in air pollution, this training provides a primer
  for the novice and a good refresher course for all others.


  Participants learn which pollutants can be measured from space, how satellites make these measurements,
  the do’s and don’ts of interpreting satellite data, and how to download and create your own visualizations.'
objectives:
- List the pollutants that can be observed by NASA satellites
- Find and download imagery for nitrogen dioxide (NO₂) and aerosols/particles
- Describe the capabilities and limitations of NASA NO₂ and aerosol measurements.
audience:
- Members of the public, journalists, meteorologists, and others new to remote sensing.
