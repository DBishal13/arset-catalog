summary: This ARSET training covers how to access and apply satellite data relevant to land indicators,
  such as estimating total forest area and forest change.
description: 'The United Nations Sustainable Development Goals (SDGs) are a series of 17 goals set to
  end global poverty and protect the planet, with the aim of achieving successes by 2030. The SDGs topics
  include global health, climate change, economic inequality, sustainability, poverty, and more. This
  training focuses on addressing SDG goal 15 and its focus to “protect, restore, and promote sustainable
  use of terrestrial ecosystems; sustainably manage forests; combat desertification; halt and reverse
  land degradation; and halt biodiversity loss.”


  In this training hosted by NASA''s Applied Remote Sensing Training program (ARSET), participants learn
  how to access and apply satellite data relevant to land indicators, such as estimating total forest
  area and forest change. The webinar includes an overview of the SDGs, as well as an introduction to
  image classification and change detection.'
objectives:
- Describe the UN Sustainable Development Goals, particularly Goal 15
- Acquire satellite observations of land cover used to assess SDG indicators 15.1.1 and 15.3.1
- Develop a basic understanding of image classification and change detection
audience:
- This training is for regional, state, federal, and international organizations interested in addressing
  monitoring requirements for the SDGs through the use of remote sensing. Professional organizations in
  the public and private sectors engaged in environmental management and monitoring will be given preference
  over organizations focused primarily on research.
