summary: This ARSET training covers how to access, interpret, and apply earth observations, with a focus
  on SDG monitoring and reporting.
description: 'This training was presented as part of the eighth session of the 2018 United Nations (UN)
  Committee of Experts on Global Geospatial Information Management (UN-GGIM 8). The training led by NASA''s
  Applied Remote Sensing Training Program (ARSET) showed the potential and current applications of Earth
  observations and geospatial information for monitoring the UN Sustainable Development Goals (SDGs).


  This two-day training incorporated a combination of lectures, demonstrations, and hands-on activities,
  featuring guest speakers from UN-GGIM, the Group on Earth Observations (GEO), NASA, and other organizations.
  Participants learned to access, interpret, and apply NASA Earth observations to local and global scales,
  with a focus on applying those observations to address SDG monitoring and reporting.


  Case studies and examples focused on the Latin American and Caribbean regions, including their priorities
  and methodological needs for monitoring and reporting SDGs.'
objectives:
- Describe the UN Sustainable Development Goals, with a focus on Goals 6 and 15
- Understand the uses and applications of Earth Observations and Geospatial Information to monitor and
  report on the SDGs
- Access, interpret, and apply NASA Earth observation data to assess SDG indicators 6.6.1 (sub-indicator
  2), 15.1.1, and 15.3.1
