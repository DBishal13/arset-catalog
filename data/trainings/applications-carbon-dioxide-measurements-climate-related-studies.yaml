sessions:
- part: 1
  title: 'XCO 2 from OCO-2 and OCO-3: Mission Recap, and Data Characteristics and Limitations'
  agenda:
  - Identify the characteristics and limitations of XCO 2 measurements from OCO-2/OCO-3.
  - Explore application areas where XCO 2 measurement is useful.
  - Identify where to access and how to use the quality flags in a data set for assessment of the measurement.
  - Interpret data and address considerations for using CO 2 in different application areas.
  videos:
  - youtube: n_Dv8c92OPc
    title: 'NASA ARSET: XCO2 from OCO-2 & OCO-3: Mission Recap, and Data Characteristics & Limitations,
      Part 1/3'
    channel: NASA Video
  materials:
  - type: slides
    title: Part 1 Presentation Slides
    url: https://earthdata.nasa.gov/s3fs-public/2025-05/ARSET-XCO22024-part1-slides.pdf
  - type: transcript
    title: Part 1 Q&A Transcript
    url: https://earthdata.nasa.gov/s3fs-public/2025-05/ARSET-XCO22024-part1-qa.pdf
- part: 2
  title: The Impact of Drought on CO 2
  agenda:
  - Identify El Niño event effects that can create regional drought conditions.
  - Monitor global fluxes of atmospheric CO 2 concentrations to identify vulnerable areas.
  - Use OCO-2 data to visualize areas impacted by drought and perform an interpretative and comparative
    analysis.
  - Identify the methods and processes to derive fluxes with atmospheric CO 2 measurements and interpret
    regional flux perturbations and country-scale fluxes and emissions.
  - Follow steps to clone the ARSET Github repository and maintain the local code.
  videos:
  - youtube: AeBy7lFKbgE
    title: 'NASA ARSET: The Impact of Drought on CO2, Part 2/2'
    channel: NASA Video
  materials:
  - type: slides
    title: Part 2 Presentation Slides
    url: https://earthdata.nasa.gov/s3fs-public/2025-05/ARSET-XCO22024-part2-slides.pdf
  - type: notebook
    title: OCO-2 Training Notebook
    url: https://github.com/NASAARSET/ARSET_CO2_Measurements_Climate/blob/main/arset-oco-earthaccess-download-analysis-2024-test-query-download-monthly-ave-compare-visualize-export.ipynb
  - type: notebook
    title: CMS FLux Training Notebook
    url: https://github.com/NASAARSET/ARSET_CO2_Measurements_Climate/blob/main/arset-oco-earthaccess-download-analysis-2024-test-fluxes.ipynb
  - type: transcript
    title: Part 2 Q&A Transcript
    url: https://earthdata.nasa.gov/s3fs-public/2025-05/ARSET-XCO22024-part2-qa.pdf
- part: 3
  title: CO 2 Measurements over a Large Urban Area
  agenda:
  - Recognize the importance and challenges of measuring carbon dioxide over metropolitan areas.
  - Identify important aspects of space-based CO 2 measurements over urban areas.
  - Visualize OCO-3 Snapshot Area Maps (SAM) data over urban areas and perform an interpretative and comparative
    analysis.
  - Access, subset, and download multi-year OCO-3 SAM data using a provided Jupyter notebook.
  videos:
  - youtube: B-Y1uz02Ccg
    title: 'NASA ARSET: CO2 Measurements over a Large Urban Area, Part 3/3'
    channel: NASA Video
