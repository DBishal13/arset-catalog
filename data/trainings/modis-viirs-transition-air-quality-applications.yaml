summary: This ARSET training covers how to access VIIRS data products, the differences between VIIRS and
  MODIS, and its air quality applications.
description: 'With the end of the Moderate Resolution Imaging Spectroradiometer (MODIS) data record approaching,
  it is important that current MODIS users transition to Visible Infrared Imaging Radiometer Suite (VIIRS)
  data and visualization tools. As they make this transition, users also need information regarding which
  MODIS geophysical parameters will be available with VIIRS and vice-versa, and the differences between
  them.


  This training, led by NASA''s Applied Remote Sensing Training (ARSET) program, teaches participants
  how to access VIIRS data products, the differences involved in using VIIRS as opposed to MODIS, and
  how to apply VIIRS aerosol optical depth observations for air quality applications.'
objectives:
- Access NASA VIIRS aerosol products through Earthdata
- Describe the differences between the MODIS and VIIRS instruments and aerosol optical depth (AOD) products
- Understand how VIIRS AOD observations can be used for modeling and monitoring of air pollution transport
audience:
- This webinar is designed for MODIS end-users from all around the world, both applied and those involved
  in research.
