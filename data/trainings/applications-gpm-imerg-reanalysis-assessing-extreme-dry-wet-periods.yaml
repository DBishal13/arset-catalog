summary: This ARSET training focuses on the analysis and interpretation of long-term IMERG data for extreme
  dry and wet period monitoring and management.
description: 'It is well recognized that long-term precipitation measurements are necessary for understanding
  and monitoring regional precipitation characteristics. This includes characteristics crucial for monitoring
  water resources and hazards like floods and droughts. The Tropical Rainfall Measuring Mission (TRMM)
  was the first NASA mission dedicated to observing precipitation. It operated from November 1997 to April
  2015. The Global Precipitation Measurement (GPM) Mission launched in February 2014 as a follow-on to
  TRMM.


  Both TRMM and GPM satellites, together with additional national and international satellites, were used
  to produce multi-satellite products such as TMPA and IMERG. Until recently, these two separate products
  covered different time periods. There was a lack of long-term, continuous precipitation time series
  data.


  Recently, GPM-IMERG retrospectively analyzed TRMM-TMPA data to produce a consistent, combined precipitation
  time series from 2000-present. This extended IMERG data product is available at half-hourly resolution
  and 0.1x0.1 degree spatial resolution. The product will be useful for deriving long-term mean precipitation
  as reference. It will also help with monitoring extreme precipitation at regional scale.


  Past Applied Remote Sensing Training Program (ARSET) trainings on water resources and flood management
  covered TMPA and IMERG data and their applications in detail. This advanced training focuses on the
  analysis and interpretation of the new long-term IMERG data, focused on extreme dry and wet period monitoring
  and management. The sessions include lectures and hands-on exercises to derive regional precipitation
  statistics.'
objectives:
- Derive regional precipitation statistics (mean, standard deviation, anomalies, percentile values)
- Calculate and interpret the Standardized Precipitation Index (SPI) for assessing extreme dry and wet
  periods
audience:
- Local, regional, state, federal, and international entities, including public and private sector organizations,
  engaged in water resources and disaster management.
