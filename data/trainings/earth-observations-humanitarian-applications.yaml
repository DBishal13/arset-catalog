summary: This ARSET training focuses on flood risk, heat stress, and drought effects on agricultural landscapes
  in refugee settings.
description: 'Refugees, internally displaced people (IDPs), and other displaced populations are made more
  vulnerable to climate change impacts due to their socio-political marginalization. This three-part training
  presents concrete strategies for mapping localized climate conditions with risks faced by refugee and
  IDP communities around the world, and is a follow-on to our 2022 Introductory training, Humanitarian
  Applications Using NASA Earth Observations.


  The training will focus on flood risk assessments and specific challenges for assessing flood risk in
  refugee and IDP camps; gauging long-term heat stress in refugee camps and the challenges with decision
  making surrounding heat risk; and monitoring drought effects on agricultural landscapes in refugee settings
  using Earth observations (EO) to explore the correlations between anomalies in crop productivity and
  weather-based factors.


  By the end of the training, participants will be able to integrate EO, building footprint and infrastructure
  data, and population data to quantify climate risk and development trends in specific humanitarian settings,
  and recognize the value and limitations of specific EO and geospatial datasets.


  Optional: To follow along with the demonstrations for this training, please review optional prerequisites
  listed under each training part below.'
