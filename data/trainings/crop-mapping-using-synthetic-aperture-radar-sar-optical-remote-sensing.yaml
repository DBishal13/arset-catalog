summary: This ARSET training provides an advanced understanding of radar remote sensing techniques for
  agriculture using machine learning methods.
description: 'Remote sensing methods based on optical and/or radar sensors have become an important means
  of extracting information related to crops. Optical data is related to the chemical properties of the
  vegetation, while radar data is related to vegetation structure and moisture. Radar can also image the
  Earth’s surface regardless of almost any type of weather condition.


  This three-part, advanced training builds on previous ARSET agricultural trainings. Here we present
  more advanced radar remote sensing techniques using polarimetry and a canopy structure dynamic model
  to monitor crop growth. The training will also cover how to apply machine learning methods to classify
  crop type using a time series of Sentinel-1 & Sentinel-2 imagery. This series will include practical
  exercises using the Sentinel Application Platform (SNAP) and Python code written in Python Jupyter Notebooks,
  a web-based interactive development environment for scientific computing and machine learning.


  This webinar series is a collaboration between ARSET, Agriculture and Agri-Food Canada (AAFC), European
  Space Agency (ESA), University of Stirling, University of Ljubljana, and the CEOS Working Group on Capacity
  Building & Data Democracy (WGCapD).'
