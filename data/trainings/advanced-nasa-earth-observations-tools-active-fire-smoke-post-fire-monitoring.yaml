summary: This ARSET training introduces participants to several capabilities within FIRMS that were not
  included in the previous ARSET training.
description: 'Satellite observations can be used to detect active fires as well as monitor the impacts
  of fires on air quality and ecosystems. Monitoring post-fire impacts to vegetation is essential for
  evaluating burn severity, which informs post-fire debris flow risk; understanding patterns in ecosystem
  recovery; and identifying areas that require restoration intervention. Wildfire smoke monitoring is
  also critical for air quality and public health applications, as exposure to fine particulate matter
  within smoke can cause respiratory issues and other health complications.


  Along with active fires, satellite sensors can detect static thermal anomalies (STA) from natural heat
  sources, such as volcanoes, or industrial heat sources such as mineral processing plants, gas flares,
  and waste incinerators. Multiple sources of satellite imagery and derived data products relevant to
  smoke, post-fire conditions, and STA identification are available within NASA''s Fire Information for
  Resource Management System (FIRMS).


  This two-part training led by NASA''s Applied Remote Sensing Training (ARSET) program will introduce
  participants to several capabilities within FIRMS that were not included in the previous ARSET training,
  Introduction to NASA Earth Observations and Tools for Wildfire Monitoring and Management. Participants
  will learn how to use the FIRMS aerosol index indices, burned area products, post-fire indices and imagery,
  static thermal anomaly information, and how to use Jupyter Notebooks to ingest and visualize active
  fire detection data.'
objectives:
- Access relevant post-fire imagery in the FIRMS Burned Area Mode to assess burned area, burn severity,
  and other factors for an event of interest.
- Identify and track wildfire smoke over time using Corrected Reflectance, OMPS Aerosol Index, and PyroCB
  layers available in the FIRMS Smoke/Aerosols Mode. Understand when to use the PyroCb layer.
- Use relevant data in FIRMS to identify STA associated with industrial or natural sources that are not
  vegetation fires.
- Use Jupyter Notebooks to access and visualize FIRMS data for different case studies.
