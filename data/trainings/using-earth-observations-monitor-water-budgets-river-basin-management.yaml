id: using-earth-observations-monitor-water-budgets-river-basin-management
title: Using Earth Observations to Monitor Water Budgets for River Basin Management
status: draft
source_url: https://www.earthdata.nasa.gov/learn/trainings/using-earth-observations-monitor-water-budgets-river-basin-management
level: introductory
format: online-instructor-led
languages:
- en
start_date: '2019-03-13'
end_date: '2019-04-03'
published: '2019-03-13'
last_updated: '2026-01-27'
summary: This ARSET training introduces using satellite data and Earth system modeling data sources to
  estimate surface water budgets.
description: Rivers are a major source of freshwater. They support aquatic and terrestrial ecosystems,
  provide transportation, and generate hydropower. Managing river basin watersheds is critical for developing
  policies for sustainable water allocation and development. This introductory training series led by
  NASA's Applied Remote Sensing Training program (ARSET) addresses how to use satellite data and Earth
  system modeling data sources to estimate surface water budgets.
objectives:
- Remote sensing and Earth system modeling data sources relevant for river basin watershed management
- Estimating surface water budgets and their temporal variability in sub-watersheds within river basins
audience:
- The content of this training was developed for local, regional, state, federal, and international organizations
  engaged in the management of water resources, river basins, floods, droughts, land development, river
  transportation, hydroelectric power, and reservoirs.
prerequisites:
- fundamentals-remote-sensing
applications:
