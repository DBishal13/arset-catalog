summary: This ARSET training introduces remote sensing observations for monitoring the water level of
  lakes.
description: 'Natural lakes and man-made reservoirs are a part of Earth’s surface water. Freshwater lakes
  and reservoirs are used for drinking water, fishing, and recreational activities. Aside from the aesthetic
  and scenic value added by their presence, lakes support surrounding plant and aquatic ecosystems and
  wildlife.


  A variety of factors affect lakes and reservoirs, including climate variability and change, land use,
  and other watershed activities influencing surface runoff and groundwater. Therefore, monitoring the
  water quantity and quality of lakes and reservoirs is crucial for their sustainable management.


  This training focuses on introducing remote sensing observations for monitoring the water level of lakes,
  a critical surface water component affecting the residential, economical, and recreational sectors in
  the area. Observations of lake bathymetry based on remote sensing observations are also presented.'
objectives:
- Identify the remote sensing data and methodology required to obtain water level and bathymetry of lakes
- Access water height and bathymetry data for monitoring lake levels
- Understand the use of lake level and bathymetry data for lake and reservoir management
audience:
- Federal, state, regional, and local public and private organizations involved in water resources and
  ecosystem management, dam and hydropower operations, and waterfront recreation and development planning.
prerequisites:
- fundamentals-remote-sensing-0
applications:
- water-resources
satellites:
- icesat-2
tools:
- google-earth-engine
