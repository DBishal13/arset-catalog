summary: This ARSET training covers the NASA data and tools useful for monitoring tropical storms.
description: 'Tropical storms have major impacts, including loss of life and destruction of property.
  In 2017 alone, the United States experienced three tropical storms with more than $1 billion in losses.
  Open source satellite data can be used before, during, and after a storm for monitoring and response.
  A storm’s intensity, path, wind, precipitation, storm surge, and flooding can be derived from historical
  and near real-time satellite observations.


  In this introductory training led by NASA''s Applied Remote Sensing Training Program (ARSET), participants
  learn about the NASA data and tools they can use to monitor tropical storms.'
objectives:
- Identify remote sensing data and tools relevant to tropical storms
- Monitor conditions before, during, and after a storm using remote sensing data
- Understand how remote sensing data can be used in decision-making activities
audience:
- This training is primarily intended for individuals and organizations engaged in emergency management,
  such as relief organizations, transportation and utility providers, public health professionals, and
  insurance providers.
