id: creating-using-normalized-difference-vegetation-index-ndvi-from-satellite-imagery
title: Creating and Using Normalized Difference Vegetation Index (NDVI) from Satellite Imagery
status: draft
source_url: https://www.earthdata.nasa.gov/learn/trainings/creating-using-normalized-difference-vegetation-index-ndvi-from-satellite-imagery
level: advanced
format: online-instructor-led
languages:
- en
start_date: '2016-02-10'
end_date: '2016-03-02'
published: '2026-03-02'
last_updated: '2026-03-03'
summary: This ARSET training covers how to acquire, use, and derive NDVI imagery from Landsat and MODIS.
description: In this advanced training, participants learned how to acquire, use, and derive NDVI imagery
  from Landsat and MODIS. Weekly webinars included lectures, hands-on demonstrations of exercises, and
  written instructions on how to conduct the exercises. The exercises used QGIS, a cross-platform open
  source GIS application. Each session guided participants through the exercises.
objectives:
- A basic understanding of NDVI
- Acquiring Landsat and MODIS imagery
- Creating NDVI images from Landsat
- Using MODIS NDVI images to derive time series and NDVI anomaly maps.
audience:
- Local, regional, state, federal, and international organizations interested in assessing vegetation
  condition using satellite imagery. Professional organizations in the public and private sectors engaged
  in environmental management and monitoring will be given preference over organizations focused primarily
  on research.
