summary: This ARSET training covers techniques for improving sustainable land management practices.
description: 'Indigenous territories are threatened by fires, illegal logging, mining, and other external
  land use activities. The sustainable management of such land – most effectively stewarded by indigenous
  peoples – is critical for mitigating greenhouse gas emissions, increasing resilience to climate change,
  conserving biodiversity, and protecting the heritage of indigenous cultures.


  Earth Observations for Indigenous-led Land Management (EO4IM) is a NASA-funded project implemented by
  a team from Conservation International (CI) and is aligned with the AmeriGEOSS program of the Group
  on Earth Observations (GEO) and the Dedicated Grant Mechanism (DGM) for Indigenous Peoples and Local
  Communities. The project''s objective is to strengthen the technical capacities of indigenous peoples''
  organizations in the Americas and globally through alignment with the DGM.


  This introductory training series led by NASA''s Applied Remote Sensing Training program (ARSET) shares
  lectures, case studies, and demonstrations with representatives of indigenous peoples'' organizations.
  The series focuses on how Earth observations (EO) data and tools can provide spatial information for
  forest monitoring, mapping, and responding to ecosystem threats. This training helps attendees strengthen
  their technical capacities to use EO data and tools to enhance their sustainable land management practices.'
objectives:
- Describe the basic concepts of remote sensing, satellite sensors, and image interpretation relevant
  to sustainable land management
- Name the satellite data and mapping tools available to inform sustainable land management decisions
  such as mapping traditional ecological knowledge, cultural heritage, forest monitoring, and fire management
- Access data portals, web tools, software, mobile apps, and systems for early warning and alerts
audience:
- This training is for indigenous peoples’ organizations and local and regional organizations focused
  on sustainable land management, mapping, forest monitoring, and enforcement activities.
applications:
- climate-resilience
- ecological-conservation
