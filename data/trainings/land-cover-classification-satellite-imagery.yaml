summary: This ARSET training focuses on using satellite imagery for land cover classification.
description: Land cover classification is an important first step to assessing land cover and land use.
  This advanced webinar hosted by NASA's Applied Remote Sensing Training Program (ARSET) provides lectures
  and hands-on activities focused on using satellite imagery for land cover classification. Participants
  can learn how to acquire Landsat imagery, display it in an open-source geographic information system
  (GIS), analyze spectral signatures of land cover types, and conduct a supervised land cover classification.
objectives:
- Understand how to access and download Landsat imagery
- Become familiar with Landsat bands and color combinations
- 'Learn the basic steps for conducting a supervised land cover classification by: Creating training sites
  Analyzing differences in spectral signatures'
- Creating training sites
- Analyzing differences in spectral signatures
- Understand the differences between an unsupervised classification and a supervised classification
audience:
- This training is intended for local, regional, state, federal, and international organizations interested
  in assessing vegetation condition using satellite imagery.
