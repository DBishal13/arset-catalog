summary: This ARSET training introduces the ecological applications of time series analysis.
description: 'The evaluation of satellite imagery over time can be used to identify trends and changes
  in an area. This type of time series analysis can be used to assess forest disturbance, land cover changes,
  vegetation health, and agricultural monitoring and expansion. NASA Earth observations can provide long-term
  records from Landsat and frequent imagery from sensors including Moderate Resolution Imaging Spectroradiometer
  (MODIS).


  This training led by NASA''s Applied Remote Sensing Training program (ARSET) focuses on two tools, Application
  for Extracting and Exploring Analysis Ready Samples (AppEEARS) from NASA''s Land Processes Distributed
  Active Archive Center (LP DAAC), and LandTrendr via Google Earth Engine (GEE). AppEEARS enables users
  to integrate point or polygon ground-based data with satellite imagery.


  The GEE implementation of LandTrendr enables users to analyze land cover dynamics, including short-term
  disturbances and long-term trends. Both sessions feature a lecture followed by time for hands-on exercises
  and questions.'
objectives:
- Become familiar with time series analysis techniques
- Understand how to evaluate time series of MODIS and Landsat data
- Learn how to integrate point data with satellite imagery using the AppEEARS web-based interface
- 'Learn the basics of the GEE implementation of LandTrendr including: Generating annual land surface
  reflectance images Plotting a time series of land surface reflectance Creating a map of change detection,
  magnitude of change, duration of change event, and pre-change spectral values'
- Generating annual land surface reflectance images
- Plotting a time series of land surface reflectance
- Creating a map of change detection, magnitude of change, duration of change event, and pre-change spectral
  values
audience:
- This training is for advanced users of remote sensing data within local, regional, state, federal, and
  non-governmental organizations involved in land management and conservation efforts.
