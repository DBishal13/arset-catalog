summary: This ARSET training highlights applications of remote sensing for identifying invasive plant
  species of interest.
description: 'Invasive species costs the U.S. economy billions of dollars a year and can cause declines
  in ecosystem health. NASA data can be used to identify the impacts of invasive species including the
  extent, potential distribution, and impacts to affected ecosystems. With improvements to the temporal,
  spatial, and spectral resolution of data alongside cloud-based computing there are new opportunities
  to apply NASA data, products, and tools to landscape management.


  This course will provide participants with an overview of typical NASA satellites and sensors used to
  map invasive plants such as Landsat, the Moderate Resolution Imaging Spectroradiometer (MODIS), and
  the Visible Infrared Imaging Radiometer Suite (VIIRS), as well as innovative or upcoming data and missions
  such as the Global Ecosystem Dynamics Investigation (GEDI), the Hydrological Modeling and Analysis Platform
  (HyMap), the Surface Biology and Geology (SBG) mission, and the Geosynchronous Littoral Imaging and
  Monitoring Radiometer (GLIMR).


  This training will highlight project-based applications of remote sensing for plant species of interest
  especially those affecting grasslands and aquatic inland lakes and waterbodies, and more with a lens
  towards innovative uses of hyperspectral data for additional invasive species detection.'
objectives:
- Recognize the extent and impacts of invasive species on biodiversity and a changing climate.
- Identify the types of remote sensing data and products that can be used for invasive species mapping
  and monitoring.
- Explore key considerations, benefits and limitations of remote sensing data sets for invasive species.
- Identify where to access remote sensing data for monitoring invasive species and mapping relevant habitat
  and climate variables.
- Evaluate remote sensing methods used to monitor aquatic and grassland invasive plant species.
