- part: 2
  title: Monitoring of Aquatic Invasive Species with Remote Sensing
  agenda:
  - Describe the extent and impacts of aquatic invasive species on biodiversity, ecosystem functions,
    and nature’s contributions to people.
  - Describe key considerations, benefits and limitations of remote sensing of invasive species.
  - Identify applications of airborne data for monitoring aquatic invasive species.
  - Identify relevant NASA multispectral and hyperspectral data for mapping and monitoring or invasive
    species.
  - Compare remote sensing methods used to monitor aquatic invasive species.
