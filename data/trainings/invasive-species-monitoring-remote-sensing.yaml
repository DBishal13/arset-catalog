sessions:
- part: 1
  title: An Introduction to the Monitoring of Invasive Species with Remote Sensing Tools
  agenda:
  - Recognize the extent and impacts of invasive species on biodiversity and a changing climate.
  - Identify commonly used types of remote sensing data and products that can be used for invasive species
    mapping and monitoring.
  - Identify upcoming satellite missions with application for invasive species research.
  - Identify where to access commonly used remote sensing data for monitoring invasive species and mapping
    relevant habitat and climate variables.
  - Identify key considerations, benefits and limitations of remote sensing data sets for invasive species.
  - Differentiate the properties of multispectral and hyperspectral datasets for monitoring of invasive
    species.
  - Cite remote sensing methods used in invasive species monitoring from past NASA projects and recent
    literature.
