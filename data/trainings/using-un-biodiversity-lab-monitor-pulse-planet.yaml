  title: Using UN Biodiversity Lab to Support Country-Led Action on Biodiversity and Sustainable Development
  agenda:
  - Identify different types of satellites and sensors that provide free, open source data to the global
    community.
  - Understand key global biodiversity and sustainable development policy instruments as they relate to
    conservation efforts.
  - Know the vision of UNBL and understand its basic functionalities.
  - Learn from inspiring countries using spatial data to take action for people and planet.
