summary: This ARSET training provides an overview of atmospheric carbon dioxide measurements from space
  with the OCO-2 and OCO-3 satellite missions.
description: 'Carbon dioxide (CO 2) monitoring from space is becoming an increasingly important and relevant
  capability in support of climate studies and to inform policy decisions. This training provides an overview
  of atmospheric carbon dioxide measurements from space with the Orbiting Carbon Observatory-2 (OCO-2)
  and Orbiting Carbon Observatory-3 (OCO-3) satellite missions.


  The session includes a theoretical portion that describes the instrument, how the measurement is made,
  and the characteristics, limitations, and validation of the measurements. There is a discussion of the
  type of climate studies that such measurements can support. There also is a practical session where
  participants learn how to access, search, filter, and display XCO 2 data using Jupyter Notebook.'
objectives:
- Understand the characteristics and limitations of XCO 2 measurements from space
- Understand the type of climate studies that these measurements can support
- Be able to open and visualize XCO 2 data from OCO-2
audience:
- This webinar series is intended for local, regional, federal, and non-governmental organizations from
  climate agencies to use CO 2 remote sensing data in climate studies.
