summary: This ARSET training provides an overview of carbon monitoring for terrestrial ecosystems.
description: 'In this introductory course led by NASA''s Applied Remote Sensing Training program (ARSET),
  participants are provided with an overview of carbon monitoring for terrestrial ecosystems. This includes
  background information about the Intergovernmental Panel on Climate Change (IPCC), Greenhouse Gas (GHG)
  inventories, the United Nations Framework Convention on Climate Change (UNFCCC), and development of
  the Reducing Emissions from Deforestation and Degradation (REDD+) program.


  This course covers products from Landsat, the Moderate Resolution Imaging Spectroradiometer (MODIS),
  Sentinel, and other satellites and sensors commonly used for land management applications.


  This course also provides information about carbon estimation techniques and conducting accuracy assessments
  on these estimates. There are also demonstrations of tools for carbon monitoring, such as NASA’s Carbon
  Mapper. Finally, guidance on reporting and verification of carbon estimates and the larger role of carbon
  markets are discussed, as well as additional guidance on resources available to participants.'
objectives:
- Techniques for estimating carbon
- Developing accuracy assessments
- Reporting and verifying carbon estimates
audience:
- This training is for local, regional, state, federal and international organizations interested in assessing
  and reporting carbon estimates using satellite imagery.
