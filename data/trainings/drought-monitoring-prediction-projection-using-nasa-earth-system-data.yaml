summary: This ARSET training provides hands-on data analysis exercises for monitoring different types
  of drought (meteorological, hydrological, and agricultural).
description: 'The United Nations has documented that drought frequency and duration have increased globally
  since 2000. According to this report 2.3 billion people around the world are currently facing water
  stress. Although droughts only represent 15% of natural disasters, they killed 650,000 people between
  1970 and 2019. Also, it is predicted that by 2050, drought could affect more than 75% of the world’s
  population.


  Droughts affect drinking water availability, ecosystems, and crop production – critical for quality
  and sustainability of plant, animal and human lives. For better water and agricultural management it
  is crucial to monitor and forecast drought conditions.


  This four-part advanced training will build upon previous ARSET trainings and provide hands-on data
  analysis exercises for monitoring different types of drought (meteorological, hydrological, and agricultural).
  Moreover, the training will include drought prediction analysis on sub-seasonal to seasonal (S2S) time
  scales and climate change projection analysis of drought conditions.


  Optional: To follow along with the demonstrations for this training, please review optional prerequisites
  listed under each training part below.'
objectives:
- Identify important Earth Observations and tools for assessing short term (week to month) to long-term
  (seasonal to multi-decadal) drought conditions.
- Identify drought portals and relevant geophysical parameters for monitoring droughts globally and regionally.
- Access and analyze sub-seasonal to seasonal forecasts of temperature and precipitation for evolving
  drought conditions for a region of interest.
- Access and analyze climate change projection data to assess impacts on long term drought conditions
  for a region of interest.
- Explore selected regional drought monitoring tools that can be customized for a user’s region of interest.
