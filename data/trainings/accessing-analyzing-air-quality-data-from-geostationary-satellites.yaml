summary: This ARSET training provides an overview of geostationary capabilities for monitoring air quality
  around the world.
description: 'The next generation of sensors in geostationary orbit offer unprecedented temporal resolution
  for air quality observations. Low Earth orbit (LEO) satellites such as the Moderate Resolution Imaging
  Spectroradiometer (MODIS), Visible Infrared Imaging Radiometer Suite (VIIRS), Ozone Monitoring Instrument
  (OMI), and Tropospheric Monitoring Instrument (TROPOMI) can provide global coverage, but typically observe
  a given location one to two times per day. Sensors in geostationary orbit (GEO) observe the same geographic
  region at all times of the day. These datasets are essential for understanding diurnal changes in air
  quality, monitoring real-time movement of smoke and dust events, and improving model forecasting capabilities
  via data assimilation.


  This Applied Remote Sensing Program (ARSET) training is in partnership with the National Oceanic and
  Atmospheric Administration (NOAA) and the National Institute Of Environmental Research (NIER, South
  Korea) on air quality (AQ) data analysis from geostationary satellites.


  The training sessions provide an overview of geostationary capabilities for monitoring air quality around
  the world; introduce geostationary aerosol datasets from GOES-East, GOES-West, Himawari 8, and the Geostationary
  Environment Monitoring Spectrometer (GEMS); and present data access and Python tools to read and analyze
  the datasets.'
objectives:
- An understanding of aerosol and trace gas datasets from geostationary satellites.
- The capability to access, visualize, and download datasets.
- Python scripts to read and analyze air quality datasets.
audience:
- This training is intended for AQ forecasters, the AQ modeling and monitoring community, and local, state,
  and federal agencies.
