published: '2017-09-07'
last_updated: '2026-02-09'
summary: This ARSET training provides an overview of remote sensing products, tools, and applications
  for ecological modeling.
description: 'As climates shift and change, ecosystems respond in a variety of ways. Assessing the ecological
  impacts of a changing climate is crucial for natural resource management decision-making. NASA''s Earth
  observations can be used to help make these decisions.


  Led by NASA''s Applied Remote Sensing Training program (ARSET), this four-week training series, in collaboration
  with the USGS North Central Climate Center, includes an overview of the satellites, sensors, and tools
  relevant to ecological forecasting; available climate products and data for ecological modeling; scenario
  planning; and the application of modeling for species distribution and state-and-transition simulations.'
objectives:
- Understand what ecoforecasting is and its applications
- Understand how climate data supports future projections of management targets
- Articulate how scenario planning can be utilized for decision-making with multiple sources of uncertainty
- Integrate qualitative and quantitative tools to support resource management decision-making in situations
  with high uncertainty
audience:
- This training is for local, regional, state, federal, and international organizations charged with maintaining
  healthy ecosystems and interested in ecological forecasting using satellite imagery and climate data.
