summary: This ARSET training provides an overview of TEMPO aerosol products for air quality applications
  using NOAA's AerosolWatch website.
description: 'The Tropospheric Emissions: Monitoring of Pollution (TEMPO) mission is the first NASA instrument
  to continuously measure daytime air pollution over North America, from the Atlantic Ocean to the Pacific
  and from Central Canada to Mexico City, using hyperspectral imagery. Together with the Advanced Baseline
  Imager (ABI) on the Geostationary Operational Environmental Satellite–R Series (GOES-R)—which provides
  visible to infrared multispectral information every 1-10 minutes—these geostationary sensors form a
  powerful constellation for understanding diurnal changes in aerosols, their sources, their movement
  over North America, and their impacts on air quality.


  TEMPO’s UV-visible observations make possible new geostationary aerosol products, including Aerosol
  Layer Height (ALH), UV Absorbing Aerosol Index (AAI), and hourly surface estimated PM2.5 concentration.
  In addition, the synergy between TEMPO and ABI enhances the existing geostationary Aerosol Optical Depth
  (AOD) and Aerosol Detection Smoke/Dust mask products.


  This training will provide an overview of TEMPO capabilities and available NOAA aerosol products generated
  using synergistic TEMPO and ABI observations. Instructors will demonstrate how to access near real-time
  and archived TEMPO aerosol products imagery on the NOAA AerosolWatch website.


  This training includes hands-on exercises that walk participants through accessing TEMPO aerosol products
  imagery on AerosolWatch, while also demonstrating how to interpret these observations to assess the
  scope of smoke and blowing dust aerosol hazards and their potential impacts on air quality.'
objectives:
- Describe the capabilities of the TEMPO instrument and its advantages and disadvantages compared to ABI
  on the GOES-R satellites.
- Identify available TEMPO aerosol data products and recognize their characteristics, benefits, and limitations.
- Use the AerosolWatch website to visualize near real-time and archived hourly TEMPO aerosol product imagery.
- Interpret TEMPO aerosol imagery on AerosolWatch to analyze smoke and blowing dust events and anticipate
  their air quality impacts.
audience:
- North American air quality managers & forecasters within the TEMPO field of regard
- Aerosol, atmospheric composition, and air quality research scientists
