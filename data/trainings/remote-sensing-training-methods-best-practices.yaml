end_date: '2016-10-27'
published: '2016-10-13'
last_updated: '2026-01-27'
summary: This ARSET training shares best practices for how to develop remote sensing trainings for an
  organization or community of practice.
description: 'This three-part series shares the training best practices used by NASA''s Applied Remote
  Sensing Training program (ARSET). These skills will enable participants to develop their own online
  or face-to-face remote sensing trainings for their organization or community of practice. This webinar
  series provides best practices on how to:'
objectives:
- Understand the key steps needed to develop an online or onsite training
- Conduct outreach and promote trainings
- Develop and deliver effective presentations on remote sensing topics and applications
audience:
- This training is designed for organizations or individuals with experience in remote sensing who wish
  to develop remote sensing training courses or programs. It is also intended for those with experience
  in remote sensing training who wish to learn more about training best practices.
prerequisites:
- fundamentals-remote-sensing
