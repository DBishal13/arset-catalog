summary: This ARSET training teaches how to use earth observations to estimate water budgets for a given
  river basin.
description: 'Rivers are a major source of freshwater. They support aquatic and terrestrial ecosystems,
  provide transportation, generate hydropower, and when treated, provide drinking and agricultural water.
  Estimating and monitoring water budgets within a river basin is required for sustainable management
  of water resources and flooding within watersheds.


  This advanced-level training series, led by NASA''s Applied Remote Sensing Training program (ARSET),
  focuses on the use of NASA Earth observations and Earth system-modeled data for estimating water budgets
  in river basins.


  Past ARSET trainings on monitoring water budgets for river basins focused on data sources relevant for
  river basin monitoring and management, and provided case studies for estimating the water budget of
  a watershed using remote sensing products. This advanced webinar includes lectures and hands-on exercises
  for participants to estimate water budgets for a given river basin.'
objectives:
- Identify and access remote sensing and Earth system-modeled data for estimating water budgets in a river
  basin
- Explain the uncertainties involved in estimating water budgets for river basins
- Replicate the steps for estimating water budgets for a river basin and sub-watersheds using remote sensing
  products and geographic information systems
audience:
- The content of this training was developed for local, regional, state, federal, and international organizations
  engaged in the management of water resources, river basins, floods, droughts, land development, river
  transportation, hydroelectric power, and reservoirs.
