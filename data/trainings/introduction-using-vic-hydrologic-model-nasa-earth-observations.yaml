summary: This ARSET training introduces the Variable Infiltration Capacity Model, sources of satellite-derived
  input data, and implementation of the model.
description: 'Hydrologic modeling is useful for flood, drought, and water resources management. The Variable
  Infiltration Capacity (VIC) Model uses inputs to better understand hydrological processes in near real-time.
  Many of the inputs are available from NASA remote sensing and Earth system models, allowing the model
  to provide soil moisture, evapotranspiration, and runoff as outputs.


  Together with precipitation data, these outputs provide quantitative assessment of a regional water
  budget. This introductory training hosted by NASA''s Applied Remote Sensing Training Program (ARSET)
  will include an overview of the model, sources of satellite-derived input data, and implementation of
  the model.'
objectives:
- Download, install, and use the VIC model
- Set up VIC for a watershed or river basin using remote sensing data inputs
- Analyze output water resource components.
audience:
- This training is primarily intended for water resources professionals and disaster managers from local,
  state, and federal agencies, non-governmental organizations (NGOs), and the private sector.
prerequisites:
- fundamentals-remote-sensing
applications:
- water-resources
