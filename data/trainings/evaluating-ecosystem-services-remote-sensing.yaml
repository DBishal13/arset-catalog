summary: This ARSET training outlines the basics of ecosystem services and natural capital accounting.
description: 'Healthy ecosystems provide essential pieces of daily life for humans such as clean water,
  food, medicines, carbon sequestration, protection against extreme weather, and much more. Natural capital
  accounting recognizes that these assets must be maintained, managed, and measured for critical decision-making
  activities. NASA data can be used to accurately map ecosystems to support effective planning and sustainable
  decision-making.


  This training, led by NASA''s Applied Remote Sensing Training (ARSET) program, outlines the basics of
  ecosystem services and natural capital accounting. It also provides an overview of how Earth Observations
  (EO) can be used to support global frameworks and initiatives such as standards set by the United Nation’s
  System of Environmental Economic Accounting (UN-SEEA). Participants receive information on techniques
  and tools for using EO in natural capital accounting such as the use of land cover mapping, time series
  analysis, and modeling efforts conducted with the Natural Capital Project via the Integrated Valuation
  of Ecosystem Services and Tradeoffs (InVEST) software, the Artificial Intelligence for Environment and
  Sustainability (ARIES) project, and more. Case-study examples are provided to highlight locally specific
  efforts such as valuation of native pollinators, urban ecosystem accounts, valuation of coastal resilience
  and coral reef habitats, and forest conservation and carbon sequestration.'
objectives:
- Summarize primary concepts of ecosystem services and natural capital accounting
- Recall global frameworks and initiatives for ecosystem assessments
- Outline the role of NASA Earth Observations (EO) in conducting ecosystem assessments
- Identify natural capital accounting models that incorporate EO
- Discover case study examples of the use of EO for ecosystem assessments
audience:
- This webinar series is intended for local, regional, state, federal, and non-governmental organizations
  involved in land and coastal ecosystems management and natural capital accounting. Applied scientists
  and geographic information systems (GIS) professionals interested in learning how to use NASA EO data
  for ecosystem assessments and accounting are encouraged to participate.
