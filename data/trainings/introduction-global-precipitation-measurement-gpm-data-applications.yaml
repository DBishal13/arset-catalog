description: 'This training introduces participants to data and applications of the Global Precipitation
  Measurement (GPM) mission. GPM is an international satellite mission that provides next-generation observations
  of rain and snow worldwide every three hours.


  Precipitation is the most important source of freshwater, and accurate measurements are crucial in planning
  water resources for drinking water, agriculture, hydro-power, health, ecosystems, and flood management.
  The NASA Tropical Rainfall Measuring Mission (TRMM) was designed specifically for precipitation remote
  sensing. Combined with data from other national and international satellites, TRMM provides near-real
  time measurements as well as 15 years of historical measurements that can be used for a variety of societal
  applications. The TRMM satellite ceased to collect data on April 15, 2015.


  NASA launched the GPM Mission in February 2014 to ensure continued availability of improved quality,
  near-global precipitation data for societal applications and environmental decision support.'
