summary: Fundamentals of Remote Sensing introduces participants to the underlying science of satellite
  remote sensing.
description: 'In this self-paced course, you’ll learn the underlying science behind how remote sensing
  works and the basic functional characteristics of satellites and sensors. You will explore the kinds
  of satellite remote sensing data that are available, advantages and disadvantages of remote sensing,
  and some basic tools to visualize data. By the end of the course, you’ll be equipped to begin your journey
  using NASA’s no-cost, open-access remote sensing data and resources. Fundamentals of Remote Sensing
  is often a prerequisite for other ARSET trainings.


  Now available in English and Spanish!


  Note: If you do not already have an account for the ARSET learning management system, you will be prompted
  to create a free account before you can take this training.'
audience:
- These trainings are appropriate for professionals and students with no previous experience in remote
  sensing.
