last_updated: '2026-02-17'
summary: This ARSET training focuses on the use of remote sensing to understand global phenology.
description: 'This training, led by NASA''s Applied Remote Sensing Training (ARSET) program, focuses on
  the use of remote sensing to understand phenology, which is the study of life-cycle events. Phenological
  patterns and processes can vary greatly across a range of spatial and temporal scales, and can provide
  insights about ecological processes like invasive species encroachment, drought, wildlife habitat, and
  wildfire potential.


  This training highlights NASA-funded tools to observe and study phenology across a range of scales.
  Participants are exposed to the latest in phenological observatory networks and science, and how these
  observations relate to ecosystem services, the carbon cycle, biodiversity, and conservation.'
objectives:
- Summarize NASA satellites and sensors that can be used for monitoring global phenology patterns
- Outline the benefits and limitations of NASA data for phenology
- Describe the multi-scalar approach to vegetation life cycle analyses
- Compare and contrast data from multiple phenology networks
- Evaluate various projects and case-study examples of phenological data.
audience:
- This training is designed for individuals and organizations interested in using satellite imagery for
  mapping vegetation health and seasonal patterns. Professional organizations in the public and private
  sectors engaged in environmental management and monitoring will be given preference over organizations
  focused primarily on research.
