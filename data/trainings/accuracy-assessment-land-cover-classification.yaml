- en
start_date: '2018-02-13'
end_date: '2018-02-20'
published: '2018-02-13'
last_updated: '2026-01-28'
summary: This ARSET training covers how to conduct an accuracy assessment on a land cover map and identify
  which classes might be misrepresented.
description: Building on a previous training led by NASA's Applied Remote Sensing Training program (ARSET)
  titled " Land Cover Classification with Satellite Imagery," this series equips attendees with the skills
  necessary to conduct an accuracy assessment on a land cover map and identify which classes might be
  misrepresented.
objectives:
- Conduct an accuracy assessment on a land cover map
- Understand how to create and use reference data
- Become familiar with sample designs for accuracy assessment
- Develop and interpret an error matrix
audience:
- This training is primarily intended for local, regional, state, federal, and international organizations
  interested in assessing vegetation condition using satellite imagery.
prerequisites:
- fundamentals-remote-sensing
- land-cover-classification-satellite-imagery
applications:
- ecological-conservation
