summary: This ARSET training covers different techniques for applying synthetic aperture radar to disaster,
  water, and land cover applications.
description: 'Optical satellite remote sensing depends on cloudless, well-illuminated areas to produce
  quality data. This is especially problematic for collecting data during nighttime or when there is cloud
  cover. Radar is an ideal sensor because of its ability to “see” the surface through clouds or regardless
  of day or night conditions. In addition, the radar signal can penetrate through the vegetation canopy
  and provide information about conditions underneath, such as whether there is flooding. Also, techniques
  such as interferometry can track surface deformation on the order of centimeters, such as displacement
  caused by earthquakes.


  This webinar series, led by NASA''s Applied Remote Sensing Training (ARSET) program, builds on ARSET''s
  previous webinar, Introduction to Synthetic Aperture Radar. The training focuses on different techniques
  such as time-series'', polarimetry, and interferometry for mapping and monitoring disasters, water,
  and land cover applications such as deforestation, crops, flooding, and earthquakes.'
objectives:
- Use synthetic aperture radar (SAR) data to map deforestation, floods, crop growth, and surface deformation
  as a result of an earthquake
audience:
- The training is designed for remote sensing users from local, regional, state, federal, and international
  organizations interested in using SAR for terrestrial applications such as inundation mapping, land
  cover land use change studies, and surface deformation for volcanic and earthquake activity.
