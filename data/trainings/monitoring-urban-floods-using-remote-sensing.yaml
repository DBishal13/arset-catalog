summary: This ARSET training focuses on areas of urban flooding that satellite data can track, including
  extreme precipitation and waterlogged and ponded surfaces.
description: 'According to the United Nations Development Program, by 2050 two-thirds of the world’s population
  is likely to live in cities. Urban flooding is already a major risk for cities. Increasing impervious
  surface area, inadequate storm water drainage, and aging infrastructure all contribute to urban flooding.
  As a result, growing urban populations will face a greater risk of flooding from extreme weather events.


  This training series hosted by NASA''s Applied Remote Sensing Training program (ARSET) focuses on the
  components of urban flooding that satellite data can track:


  Using satellite data allows individuals and organizations to develop better plans for handling floods.
  This can include developing better early warning techniques, better plans for rescue and relief, and
  more effective long-term infrastructure planning.'
objectives:
- Describe remote sensing and Earth system model data useful for flood monitoring in urban areas
- Identify how remote sensing can aid in planning early warning systems, flood response, and flood recovery
  efforts
audience:
- This training is primarily intended for urban water and disaster managers, urban planners, emergency
  responders, transportation and utility providers and planners, public health professionals, and the
  insurance sector.
