summary: This ARSET training focuses on assessing projected statistics of extreme heat and cold wave events
  and extreme precipitation excess and deficit events.
description: 'According to the World Meteorological Organization, the frequency and intensity of extreme
  weather events, including heat and cold waves, heavy precipitation and droughts, and wildfires, have
  increased fivefold in the last 50 years. While current Earth observations from NASA allow monitoring
  of these extreme events for developing regional adaptation and mitigation strategies, it is crucial
  to assess how these events will unfold over the coming decades.


  The typical spatial resolution of current Global Climate Models (GCMs) from various international institutions
  is larger than 1x1 degree latitude-longitude. For regional applications, higher spatial resolution GCM
  data is required. NASA Earth eXchange Global Daily Downscaled Projections (NEX-GDDP-CMIP6) provide global,
  high resolution, bias-corrected projections of daily minimum and maximum temperatures, precipitation,
  humidity, windspeed, and surface radiation from the Coupled Model Intercomparison Project Phase 6 (CMIP6)
  GCMs at 0.25x0.25 degree resolution.


  This two-part training, offered by NASA''s Applied Remote Sensing Training Program (ARSET), focuses
  on evaluating projected statistics of extreme heat and cold wave events, and extreme precipitation excess
  and deficit events, from NEX-GDDP-CMIP6 at regional scale during the 21st century to assess regional
  risk.'
objectives:
- Identify available daily, high-resolution geophysical parameters from NASA Earth eXchange – Global Daily
  Downscaled Projections – Coupled Model Intercomparison Project Phase 6 (NEX-GDDP-CMIP6) to assess extreme
  weather statistics at a regional scale.
- Access daily temperature and precipitation data for a region of interest to calculate and analyze weather
  statistics using NEX-GDDP-CMIP6 data in Google Earth Engine.
- Visualize maps of extreme weather statistics for a region of interest using NEX-GDDP Dashboard.
- Customize provided Python/Jupyter notebook scripts to calculate extreme weather statistics for a region
  of interest.
- Assess projected statistics of extreme heat and cold wave events, and excess and deficit precipitation
  events from NEX-GDDP-CMIP6 at regional scale during the 21st century to evaluate risk for a region of
  interest.
