- part: 1
  title: How Remote Sensing Can be Used to Study Climate-Sensitive Infectious Diseases
  date: '2025-10-07'
  agenda:
  - Identify environmental variables and conditions that can be observed from space which are relevant
    to climate-sensitive infectious disease outbreaks.
  - Identify how satellite observations can improve the assessment and forecasting of climate-sensitive
    infectious disease outbreaks.
  - List the steps of a conceptual framework for incorporating remote sensing data into the study of climate-sensitive
    infectious diseases.
  - Recognize several remote sensing datasets commonly used to study and forecast climate sensitive infectious
    diseases, along with their key attributes such as resolution, coverage, latency, and uncertainty.
  - Select appropriate remote sensing datasets for studying climate-sensitive infectious diseases based
    on the disease characteristics, region of interest, and relevant environmental parameters.
  - Examine common benefits and challenges of using remote sensing data for studying climate-sensitive
    infectious diseases.
