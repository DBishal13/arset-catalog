summary: This ARSET training covers general approaches to apply satellite remote sensing data when studying
  or forecasting climate-sensitive infectious diseases.
description: 'Climate-sensitive vector-borne diseases such as malaria impact millions of people each year,
  causing more than 700,000 deaths annually, according to the World Health Organization (WHO). Satellite
  remote sensing data can provide valuable insights for monitoring the conditions which support disease
  vectors.


  In this training, participants learn the basic principles of how satellite remote sensing data can be
  applied to track vector-borne disease outbreaks that are influenced by weather and climate and to provide
  early warnings for potential outbreaks. Participants will learn about general approaches to apply satellite
  remote sensing data when studying or forecasting climate-sensitive infectious diseases. These are illustrated
  with a case study example in forecasting malaria.


  Participants will also become familiar with some of the common, freely available NASA remote sensing
  datasets used in these applications, where and how to access them, and how to decide which datasets
  are fit for their purpose.'
objectives:
- Identify environmental variables and conditions that can be observed from space which are relevant to
  climate-sensitive infectious disease outbreaks.
- Identify the steps and tools needed to study climate-sensitive infectious disease outbreaks using remote
  sensing data.
- Recognize several remote sensing datasets commonly used to study and forecast climate sensitive infectious
  diseases, along with their key attributes such as resolution, coverage, latency, and uncertainty.
- Select appropriate remote sensing datasets for studying climate-sensitive infectious diseases based
  on the disease characteristics, region of interest, and relevant environmental parameters.
- Examine the benefits and challenges of using remote sensing data for studying climate-sensitive infectious
  diseases through the case study of the EPIDEMIA system tracking and forecasting malaria in Ethiopia.
