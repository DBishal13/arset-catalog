summary: This ARSET training focuses on NASA products available to assess sea level change.
description: 'Global sea level has been rising at a rate of 3 mm/yr, and this rate is projected to continue
  to increase sea level over the next century. Scientists use observations from the ground, air, and space,
  along with theoretical models and scenarios of future emissions, to monitor and study past, present,
  and future sea level rise. This information is a fundamental basis for mitigation, adaptation, and risk
  management planning in all parts of the world and across many elements of society and ecosystems.


  This two-part introductory training series hosted by NASA''s Applied Remote Sensing Training program
  (ARSET) focuses on NASA products and tools available to assess historical sea level rise, access and
  understand projections of sea level, and investigate impacts. Participants are exposed to the causes
  behind regional and global sea level changes and explore climate and analysis tools to access, visualize,
  and perform statistical analysis using NASA data.'
