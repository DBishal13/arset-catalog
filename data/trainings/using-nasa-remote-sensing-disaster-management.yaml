summary: This ARSET training provides an overview of NASA remote sensing data and applications for disaster
  management.
description: NASA remote sensing and modeling resources are useful for managing a variety of disasters
  – including earthquakes, tsunamis, volcanoes, floods, landslides, wildfires, and oil spills – and particularly
  in regions with very little in situ data. This introductory course led by NASA's Applied Remote Sensing
  Training program (ARSET) provides an overview of the agency's remote sensing data and applications for
  disaster management.
audience:
- This training is designed for national and international entities involved in disaster and water resources
  management, decision support activities, and relief and humanitarian activities.
prerequisites:
- fundamentals-remote-sensing
applications:
- disasters
