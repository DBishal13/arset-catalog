<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARSET Catalog</title>
  <meta name="description" content="Every NASA ARSET training, recording, instructor, satellite and dataset in one place.">
  <meta name="theme-color" content="#060a13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2338bdf8'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23a78bfa' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("arset-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="ARSET Catalog home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="8.5" class="brand-planet"/><ellipse cx="16" cy="16" rx="15" ry="5.2" class="brand-ring" transform="rotate(-20 16 16)"/></svg>
        <span>ARSET<b>Catalog</b></span>
      </a>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="top-actions">
        <button type="button" class="search-trigger" id="open-palette" aria-label="Search everything (Ctrl+K)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span><kbd>Ctrl K</kbd>
        </button>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark theme"></button>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>

  <div class="palette" id="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search the catalog">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-q" type="search" placeholder="Search trainings, instructors, satellites, datasets…" autocomplete="off" aria-controls="palette-results">
        <kbd>Esc</kbd>
      </div>
      <ul id="palette-results" role="listbox"></ul>
    </div>
  </div>

  <div class="player" id="player" hidden>
    <div class="player-backdrop" data-close></div>
    <div class="player-box" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="player-head">
        <div><div class="eyebrow" id="player-sub"></div><h2 id="player-title"></h2></div>
        <button type="button" class="icon-btn" data-close aria-label="Close video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="player-frame" id="player-frame"></div>
      <div class="player-foot" id="player-foot"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
